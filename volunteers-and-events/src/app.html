<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Layout: one calm column, a header that says where your work is saved, five tabs (bottom bar on a phone). */
:root{
  --bg:#f2f4f0;--surface:#fffefa;--sunk:#e9ede7;--ink:#1e2a28;--muted:#56645f;--line:#d6ddd5;
  --accent:#2d6a64;--accent-ink:#ffffff;--accent-soft:#dfece8;
  --open:#7d5310;--open-soft:#f5e9d2;--done:#35663f;--done-soft:#e1eee0;
  --focus:#b07a1f;
  --display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:12px;--ease:cubic-bezier(.3,.7,.3,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131918;--surface:#1b2321;--sunk:#222c2a;--ink:#e6ece9;--muted:#9eaea9;--line:#2f3b38;
  --accent:#86c4ba;--accent-ink:#0f1a18;--accent-soft:#213531;
  --open:#e7c07e;--open-soft:#372c19;--done:#a3d3a9;--done-soft:#1f3121;--focus:#e0b25c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131918;--surface:#1b2321;--sunk:#222c2a;--ink:#e6ece9;--muted:#9eaea9;--line:#2f3b38;
  --accent:#86c4ba;--accent-ink:#0f1a18;--accent-soft:#213531;
  --open:#e7c07e;--open-soft:#372c19;--done:#a3d3a9;--done-soft:#1f3121;--focus:#e0b25c;color-scheme:dark}
html{font-size:17px}
html[data-size="large"]{font-size:19px}
html[data-size="xl"]{font-size:21px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem;letter-spacing:-.02em}
h2{font-size:1.25rem}
h3{font-size:1.02rem}
p{margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 7rem}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 10px}
.brand{font-family:var(--display);font-weight:700;font-size:1.1rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand span{overflow-wrap:anywhere}
.status{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--done)}
.status.busy .dot{background:var(--open)}
.status.warn{color:var(--open)}
.status.warn .dot{background:var(--open)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
nav.tabs a{text-decoration:none;color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap;font-weight:700}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs svg{width:20px;height:20px}
@media (max-width:640px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;background:var(--surface);border-top:1px solid var(--line);border-bottom:0;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom,0px);overflow:visible}
  nav.tabs a{flex-direction:column;gap:2px;font-size:.72rem;padding:8px 4px 10px;border-bottom:0;border-top:3px solid transparent;flex:1;align-items:center}
  nav.tabs a[aria-current="page"]{border-top-color:var(--accent)}
  h1{font-size:1.6rem}
}
main{display:flex;flex-direction:column;gap:28px;animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted)}
.small{font-size:.88rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink);transition:background .2s var(--ease)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);padding-inline:10px}
.btn.quiet:hover{color:var(--ink);background:var(--sunk)}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5;cursor:default}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:14px}
.card.lead{border-color:var(--accent);box-shadow:0 1px 0 var(--line)}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
section.block{display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:flex;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);min-width:0}
a.item:hover{background:var(--sunk)}
.item .grow{flex:1;min-width:0}
.item .name{font-weight:700;overflow-wrap:anywhere}
.item .meta{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.cal{flex:none;width:52px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:4px 0;line-height:1.1}
.cal b{display:block;font-family:var(--display);font-size:1.35rem}
.cal small{display:block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.cal.none b{font-size:1rem;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.open{background:var(--open-soft);color:var(--open)}
.chip.ok{background:var(--done-soft);color:var(--done)}
.chip.ex{background:transparent;border:1px dashed var(--line)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.92rem;min-width:0}
label.f .hint{font-weight:400;color:var(--muted);font-size:.85rem}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:1rem;font-weight:400}
textarea{min-height:90px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:var(--sunk)}
.wrap input.title-input{font-family:var(--display);font-size:1.7rem;min-height:0;font-weight:700;border:0!important;border-bottom:2px solid var(--line)!important;border-radius:0!important;padding:4px 0!important;background:transparent!important}
.wrap input.title-input:focus{border-bottom-color:var(--accent)!important;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.grid .wide{grid-column:1/-1}
.check{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.todo{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.todo input[type=text]{border-color:transparent;background:transparent;padding-inline:4px}
.todo input[type=text]:focus{border-color:var(--line);background:var(--surface)}
.todo.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.job{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:12px}
.job-head{display:grid;grid-template-columns:1fr 110px auto;gap:10px;align-items:end}
.job-times{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.job-times input{width:auto;min-width:0;flex:1 1 120px}
.who{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.who .nm{flex:1 1 160px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.who .nm a{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.hours{width:96px!important;min-height:40px!important}
.adder{display:flex;gap:8px;flex-wrap:wrap}
.adder input{flex:1 1 200px;width:auto}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;min-width:40px;min-height:40px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center}
.x:hover{background:var(--sunk);color:var(--ink)}
.x svg{width:18px;height:18px}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--radius);padding:12px 14px;font-size:.93rem}
.tip p{flex:1}
.empty{color:var(--muted);padding:14px 0}
.totals{display:flex;gap:28px;flex-wrap:wrap}
.totals div b{display:block;font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.totals div span{color:var(--muted);font-size:.9rem}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.morelist a{display:flex;flex-direction:column;gap:2px}
.danger-zone{border-top:1px solid var(--line);padding-top:18px;display:flex;gap:10px;flex-wrap:wrap}
#toast{position:fixed;left:16px;right:16px;margin-inline:auto;width:fit-content;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px 10px 20px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.18);}
#toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
@media (max-width:640px){#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}.job-head{grid-template-columns:1fr 90px auto}}
.steps{margin:0;padding-left:1.4rem;display:flex;flex-direction:column;gap:10px}
.steps li{padding-left:4px}
details.faq{border-bottom:1px solid var(--line);padding:12px 0}
details.faq summary{cursor:pointer;font-weight:700}
details.faq p{margin-top:8px;color:var(--ink)}
.banner{background:var(--open-soft);color:var(--ink);border-radius:var(--radius);padding:12px 16px;font-size:.93rem}
.dots{display:flex;gap:7px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--accent)}
.tour .row-actions{justify-content:space-between}
/* The sign-in sheet: plain black lines on paper, with the app's chrome left off the page. */
.sheet h1{font-size:1.6rem}.sheet h2{margin-top:18px}
.sheet-t{width:100%;border-collapse:collapse;margin-top:6px}
.sheet-t th,.sheet-t td{border:1px solid var(--ink);padding:6px 8px;height:36px;text-align:left;font-size:.95rem}
.sheet-t th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
@media print{header.top,nav.tabs,#toast,.noprint,.tip{display:none!important}body{background:#fff;color:#000}.wrap{padding:0;max-width:none}main{animation:none;gap:0}.sheet-t th,.sheet-t td{border-color:#000}}
.loading{padding:60px 0;color:var(--muted);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="10" cy="11" r="5" fill="var(--accent)"/><circle cx="19" cy="11" r="5" fill="var(--open)" opacity=".85"/><path d="M3 25c1-5 4-7 7-7s5 1 6 3c1-2 3-3 5-3 3 0 5 2 6 7" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/></svg><span id="org">Volunteers &amp; Events</span></div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
  <main id="main" tabindex="-1"><p class="loading">Opening…</p></main>
</div>
<div id="toast" hidden role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const APP='nami-volunteers-events',VERSION='2.2';
const GUIDES='https://github.com/jessejberg-cloud/nami_grant_dashboard/blob/main/volunteers-and-events/dist/';
const HUB='https://jessejberg-cloud.github.io/nami_grant_dashboard/';
const LS_DATA='nami-ve-data-v1',LS_PREFS='nami-ve-prefs-v1';
const COLS=['events','people','supporters'];
const S={data:{events:{},people:{},supporters:{}},settings:{orgName:''},mode:'local',readOnly:false,db:null,downloads:null,saving:0,problem:''};
const UI={q:{},showPast:false,from:'',to:'',confirm:'',importFile:null,importError:'',copyText:'',justAdded:'',tour:-1};
const pending={},timers={},queues={};

/* ---------- small helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>{let s='';const a='abcdefghijklmnopqrstuvwxyz0123456789';const r=new Uint32Array(12);(window.crypto||{}).getRandomValues?crypto.getRandomValues(r):r.forEach((_,i)=>r[i]=Math.random()*1e9);r.forEach(n=>s+=a[n%36]);return s};
const nowIso=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return dstr(d)};
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function deepMerge(t,s){for(const k of Object.keys(s)){if(isObj(s[k])&&isObj(t[k]))deepMerge(t[k],s[k]);else t[k]=clone(s[k])}return t}
function pathObj(path,v){const ks=path.split('.');const o={};let c=o;ks.forEach((k,i)=>{if(i===ks.length-1)c[k]=v;else c=c[k]={}});return o}
function getPath(o,path){return path.split('.').reduce((c,k)=>c==null?undefined:c[k],o)}
const parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function fmtDate(s,long){if(!s)return 'No date yet';const d=parseDate(s);const o={weekday:long?'long':'short',month:long?'long':'short',day:'numeric'};if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';return d.toLocaleDateString(undefined,o)}
function fmtTime(t){if(!t)return '';const [h,m]=t.split(':').map(Number);const ap=h<12?'am':'pm';const hh=h%12||12;return hh+(m?':'+pad(m):'')+' '+ap}
const toMin=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m};
/* Minutes between two times. Overnight (10 pm to 2 am) wraps; the same time twice is no span, not a whole day. */
function span(a,b){const x=toMin(a),y=toMin(b);if(x==null||y==null)return null;let m=y-x;if(m<0)m+=1440;return m||null}
const hrs=n=>{const r=Math.round(n*100)/100;return (Number.isInteger(r)?r:r.toFixed(2).replace(/0$/,''))};
const money=n=>'$'+(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
const plural=(n,one,many)=>n+' '+(n===1?one:many);

/* ---------- icons ---------- */
const I={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-4 3.4-6 6.5-6s5.7 2 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14c2.6 0 4.4 1.6 5 4.5"/></svg>',
 heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
 more:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>'
};

/* ---------- this person's own settings (text size, colors, tips) ---------- */
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
const prefs=Object.assign({size:'normal',theme:'device',welcomed:false,tips:{}},lsGet(LS_PREFS)||{});
function savePrefs(){lsSet(LS_PREFS,prefs)}
let themeSet=false;
function applyPrefs(){const r=document.documentElement;if(prefs.size==='normal')r.removeAttribute('data-size');else r.setAttribute('data-size',prefs.size);if(prefs.theme==='device'){if(themeSet){r.removeAttribute('data-theme');themeSet=false}}else{r.setAttribute('data-theme',prefs.theme);themeSet=true}}

/* ---------- saving ---------- */
let localTimer=null;
function saveLocalNow(){clearTimeout(localTimer);localTimer=null;if(S.mode!=='local'||!S.ready)return;const ok=lsSet(LS_DATA,{app:APP,version:1,data:S.data,settings:S.settings});S.problem=ok?'':'This browser would not save. Use More → Backup to save a file now.';paintStatus()}
function saveLocalSoon(){if(!localTimer)localTimer=setTimeout(saveLocalNow,200)}
function q(path,fn){S.saving++;paintStatus();const run=(queues[path]||Promise.resolve()).then(()=>fn().catch(e=>{if(e&&e.code==='unavailable')return new Promise(r=>setTimeout(r,1200+Math.random()*800)).then(fn);throw e}));queues[path]=run.catch(()=>{});return run.then(()=>{S.problem=''},writeError).finally(()=>{S.saving--;paintStatus()})}
function writeError(e){const c=e&&e.code;if(c==='not_granted'){S.readOnly=true;render();toast('You can look at this, but not change it. Ask whoever shared the link to make you an Editor.')}else if(c==='invalid_argument'){/* an update to a record someone else removed for good: nothing to merge into */toast('Someone removed that item, so your change to it was not kept.');soon()}else if(c==='quota_exceeded'){S.problem='Storage is full. Delete old things or ask for help.'}else{S.problem='Not saved yet. Check the internet, then change anything to try again.'}paintStatus()}
function writeDoc(col,id){const d=S.data[col][id];if(S.mode==='shared'){const body=clone(d);return q(col+'/'+id,()=>S.db.collection(col).doc(id).set(body))}saveLocalSoon();flash()}
function flushPatch(col,id){const key=col+'/'+id;clearTimeout(timers[key]);const p=pending[key];if(!p)return;delete pending[key];q(key,()=>S.db.collection(col).doc(id).update(p))}
function patch(col,id,partial,soon){if(S.readOnly)return;const d=S.data[col][id];if(!d)return;deepMerge(d,partial);d.updatedAt=nowIso();if(S.mode==='shared'){const key=col+'/'+id;pending[key]=deepMerge(pending[key]||{},clone(partial));pending[key].updatedAt=d.updatedAt;clearTimeout(timers[key]);if(soon)timers[key]=setTimeout(()=>flushPatch(col,id),700);else flushPatch(col,id)}else{saveLocalSoon();flash()}}
function flushAll(){Object.keys(pending).forEach(k=>{const [c,i]=k.split('/');flushPatch(c,i)})}
function create(col,obj){const id=uid();S.data[col][id]=Object.assign({createdAt:nowIso(),updatedAt:nowIso()},obj);writeDoc(col,id);return id}
function destroy(col,id){delete S.data[col][id];if(S.mode==='shared')q(col+'/'+id,()=>S.db.collection(col).doc(id).delete());else saveLocalSoon()}
function saveSettings(){if(S.readOnly)return;if(S.mode==='shared'){const b=clone(S.settings);q('meta/settings',()=>S.db.doc('meta/settings').set(b))}else saveLocalSoon()}
let flashT=null;
function flash(){S.flash=true;paintStatus();clearTimeout(flashT);flashT=setTimeout(()=>{S.flash=false;paintStatus()},900)}
function paintStatus(){const el=$('#status');if(!el)return;let cls='status',txt;
 if(S.readOnly){txt='View only';cls+=' warn'}
 else if(S.problem){txt=S.problem;cls+=' warn'}
 else if(S.saving>0||S.flash){txt='Saving…';cls+=' busy'}
 else txt=S.mode==='shared'?'Saved for everyone with this link':'Saved in this browser';
 el.className=cls;el.innerHTML='<span class="dot" aria-hidden="true"></span>'+esc(txt)}
window.addEventListener('beforeunload',()=>{flushAll();if(localTimer)saveLocalNow()});
window.addEventListener('pagehide',()=>{if(localTimer)saveLocalNow()});
/* Two tabs on one computer: pick up what the other tab saved. */
window.addEventListener('storage',e=>{if(e.key!==LS_DATA||S.mode!=='local')return;const v=lsGet(LS_DATA);if(v&&isObj(v.data)){COLS.forEach(c=>{S.data[c]=isObj(v.data[c])?v.data[c]:{}});if(isObj(v.settings))S.settings=Object.assign({orgName:''},v.settings);soon()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){flushAll();if(localTimer)saveLocalNow()}});

/* ---------- reading the records ---------- */
const all=col=>Object.keys(S.data[col]).map(id=>Object.assign({id},S.data[col][id])).filter(d=>!d.deleted);
const mapList=(o,keep)=>Object.keys(o||{}).filter(k=>o[k]).map(k=>Object.assign({id:k},o[k])).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.at||'').localeCompare(String(b.at||'')));
const jobs=e=>mapList(e.roles);
const signups=e=>mapList(e.signups);
const todos=e=>mapList(e.todos);
const person=id=>{const p=S.data.people[id];return p?Object.assign({id},p):null};
const pname=id=>{const p=person(id);return p?(p.name||'Unnamed volunteer'):'Someone who was removed'};
const evName=e=>e.name||'Untitled event';
function filled(e,jobId){return signups(e).filter(s=>s.roleId===jobId&&s.status!=='missed').length}
function openFor(e,j){return Math.max(0,(Number(j.needed)||0)-filled(e,j.id))}
function openSpots(e){return jobs(e).reduce((n,j)=>n+openFor(e,j),0)}
function signupHours(e,s){if(s.status!=='came')return 0;if(typeof s.hours==='number')return s.hours;const j=(e.roles||{})[s.roleId]||{};const m=span(j.start||e.start,j.end||e.end);return m?Math.round(m/15)/4:0}
function defaultHours(e,s){const j=(e.roles||{})[s.roleId]||{};const m=span(j.start||e.start,j.end||e.end);return m?Math.round(m/15)/4:null}
const isPast=e=>!!e.date&&e.date<today();
const hasStarted=e=>!!e.date&&e.date<=today();
function sortEvents(list,dir){return list.sort((a,b)=>dir*((a.date+(a.start||'')).localeCompare(b.date+(b.start||''))))}
function upcoming(){return sortEvents(all('events').filter(e=>e.date&&e.date>=today()),1)}
function undated(){return all('events').filter(e=>!e.date).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))}
function past(){return sortEvents(all('events').filter(isPast),-1)}
function needsMarking(){return past().filter(e=>e.date>=addDays(-60)&&signups(e).some(s=>s.status==='in'))[0]}
const hasAny=()=>COLS.some(c=>all(c).length);
const dis=()=>S.readOnly?' disabled':'';

/* ---------- routes ---------- */
function route(){const h=decodeURIComponent((location.hash||'').slice(1));const [page,id]=h.split('.');return {page:page||'home',id:id||''}}
function go(h){if(location.hash!=='#'+h)location.hash=h;UI.copyText='';UI.importError='';render()}
const TABS=[['home','Home',I.home],['events','Events',I.cal],['people','Volunteers',I.people],['supporters','Supporters',I.heart],['more','More',I.more]];
const TAB_OF={event:'events',sheet:'events',person:'people',supporter:'supporters',hours:'more',gifts:'more',board:'more',backup:'more',settings:'more',help:'more',deleted:'more',addmany:'more'};
function paintTabs(){const r=route();const cur=TAB_OF[r.page]||r.page;$('#tabs').innerHTML=TABS.map(([k,l,ic])=>'<a href="#'+k+'"'+(cur===k?' aria-current="page"':'')+'>'+ic+'<span>'+l+'</span></a>').join('');$('#org').textContent=S.settings.orgName||'Volunteers & Events'}

/* ---------- pieces ---------- */
function calBox(d){if(!d)return '<div class="cal none" aria-hidden="true"><b>?</b><small>date</small></div>';const x=parseDate(d);return '<div class="cal" aria-hidden="true"><small>'+x.toLocaleDateString(undefined,{weekday:'short'})+'</small><b>'+x.getDate()+'</b><small>'+x.toLocaleDateString(undefined,{month:'short'})+'</small></div>'}
function whenLine(e){const t=e.start?fmtTime(e.start)+(e.end?' – '+fmtTime(e.end):''):'';return [e.date?fmtDate(e.date):'',t,e.place].filter(Boolean).join(' · ')}
function spotsChip(e){if(isPast(e)||!jobs(e).length)return '';const n=openSpots(e);return n?'<span class="chip open">'+plural(n,'spot','spots')+' open</span>':'<span class="chip ok">Every job has someone</span>'}
const exChip=d=>d.example?'<span class="chip ex">Example</span>':'';
function eventRow(e){return '<a class="item" href="#event.'+e.id+'">'+calBox(e.date)+'<div class="grow"><div class="name">'+esc(evName(e))+'</div><div class="meta">'+esc(whenLine(e)||'Add a date when you know it')+'</div></div><div class="chips">'+spotsChip(e)+exChip(e)+'</div></a>'}
/* A one-line hint. Got it puts it away for good; Later brings it back tomorrow. */
function tip(key,text){const t=prefs.tips[key];if(t===true||(t&&t>today()))return '';return '<div class="tip"><p>'+text+'</p><span class="row-actions"><button class="btn quiet" data-a="tip" data-k="'+key+'">Got it</button><button class="btn quiet" data-a="tip-later" data-k="'+key+'">Later</button></span></div>'}
const TOUR=[['home','Home','Home shows your next event, one gentle reminder if a past event still needs marking, and what is coming up.'],['events','Events','Every event lives here. New event starts one, and a name is enough. The jobs, the names and the to-do list are on the event\'s own page.'],['people','Volunteers','Everyone you have added, with their phone, email and what they like to help with. Add many at once pastes in a whole list.'],['supporters','Supporters','Donors, sponsors and partners. Add a gift on a supporter\'s page and mark it Promised, then Received when it arrives.'],['more','More','Volunteer hours and Gifts add things up for reports. Backup saves a file. Settings has text size and colors. Help has the guides.']];
function viewTour(){const i=UI.tour,s=TOUR[i];if(!s)return '';return '<section class="card lead tour" aria-live="polite"><p class="eyebrow">A short tour</p><h2>'+esc(s[1])+'</h2><p>'+esc(s[2])+'</p><div class="row-actions"><span class="dots" aria-hidden="true">'+TOUR.map((x,k)=>'<i'+(k<=i?' class="on"':'')+'></i>').join('')+'</span><span class="row-actions"><button class="btn quiet" data-a="tour-skip">Skip the tour</button><button class="btn primary" data-a="tour-next">'+(i===TOUR.length-1?'Done':'Next')+'</button></span></div></section>'}
function field(col,id,path,label,opts){opts=opts||{};const d=S.data[col][id];const v=getPath(d,path);const fid='f-'+col+'-'+id+'-'+path.replace(/\./g,'-');const t=opts.type||'text';const hint=opts.hint?'<span class="hint">'+esc(opts.hint)+'</span>':'';const cls=opts.wide?' wide':'';
 let ctl;
 if(t==='textarea')ctl='<textarea id="'+fid+'" data-b="'+col+'|'+id+'|'+path+'" placeholder="'+esc(opts.ph||'')+'"'+dis()+'>'+esc(v)+'</textarea>';
 else if(t==='select')ctl='<select id="'+fid+'" data-b="'+col+'|'+id+'|'+path+'"'+dis()+'>'+opts.options.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return '<option value="'+esc(val)+'"'+(String(v||'')===String(val)?' selected':'')+'>'+esc(lab)+'</option>'}).join('')+'</select>';
 else ctl='<input id="'+fid+'" type="'+t+'"'+(t==='number'?' inputmode="decimal" min="0" step="any"':'')+' data-b="'+col+'|'+id+'|'+path+'" value="'+esc(v==null?'':v)+'" placeholder="'+esc(opts.ph||'')+'"'+(opts.auto?' autocomplete="'+opts.auto+'"':'')+dis()+'>';
 return '<label class="f'+cls+'" for="'+fid+'">'+esc(label)+hint+ctl+'</label>'}
function backLink(h,l){return '<a class="btn quiet" href="#'+h+'" style="align-self:flex-start">'+I.back+esc(l)+'</a>'}
function addBtn(action,label,extra){return S.readOnly?'':'<button class="btn primary" data-a="'+action+'"'+(extra||'')+'>'+I.plus+esc(label)+'</button>'}
function search(key,ph){return '<label class="sr" for="q-'+key+'">Search</label><input type="search" id="q-'+key+'" data-search="'+key+'" placeholder="'+esc(ph)+'" value="'+esc(UI.q[key]||'')+'">'}
const match=(key,...vals)=>{const s=(UI.q[key]||'').trim().toLowerCase();return !s||vals.some(v=>String(v||'').toLowerCase().includes(s))};

/* ---------- Home ---------- */
function viewWelcome(){const fresh=!hasAny();return '<section class="card lead"><p class="eyebrow">Welcome</p><h1>Keep your events and helpers in one place</h1><p class="sub">Plan an event, list the jobs you need help with, and add the volunteers who said yes. After the event, mark who came and their hours add up on their own.</p><ol class="steps"><li>Add an event. A name is enough to start.</li><li>Add the jobs, like Greeter or Setup, and how many people each needs.</li><li>Type a volunteer\'s name under a job. New names are saved as volunteers for you.</li></ol><div class="row-actions">'+(S.readOnly?'':'<button class="btn primary" data-a="new-event">'+I.plus+(fresh?'Add my first event':'Add an event')+'</button>'+(fresh?'<button class="btn" data-a="examples">Look around with examples first</button>':''))+'<button class="btn" data-a="tour-start">Show me around</button><button class="btn quiet" data-a="welcomed">'+(fresh?'Skip':'Close')+'</button></div>'+(fresh?'<p class="sub small">Example records are marked “Example” and come out in one tap from More → Settings.</p>':'')+'</section>'}

  else h+='<p class="sub">No volunteer jobs listed yet.</p>';
  if(ts.length)h+='<div>'+ts.map(t=>todoRow(next,t)).join('')+'</div>';
  h+='<div class="row-actions"><a class="btn primary" href="#event.'+next.id+'">Open event</a></div></section>';}
 else h+='<section class="card"><h2>Nothing on the calendar yet</h2><p class="sub">Add an event when one is coming up.</p><div class="row-actions">'+addBtn('new-event','New event')+'</div></section>';

 const rest=up.slice(1,6);if(rest.length)h+='<section class="block"><h2>Coming up</h2><div class="list">'+rest.map(eventRow).join('')+'</div></section>';

 return h}

function viewEvents(){const f=e=>match('events',e.name,e.place,e.notes);const up=upcoming().filter(f),nd=undated().filter(f),ps=past().filter(f);const shown=UI.showPast?ps:ps.slice(0,8);
 let h='<div class="head"><h1>Events</h1>'+addBtn('new-event','New event')+'</div>'+search('events','Search events');

function todoRow(e,t){const fid='td-'+e.id+'-'+t.id;return '<div class="todo'+(t.done?' done':'')+'"><input type="checkbox" id="'+fid+'-c" data-b="events|'+e.id+'|todos.'+t.id+'.done" aria-label="Done"'+(t.done?' checked':'')+dis()+' style="width:22px;height:22px;accent-color:var(--accent)"><label class="sr" for="'+fid+'">To-do</label><input type="text" id="'+fid+'" data-b="events|'+e.id+'|todos.'+t.id+'.text" value="'+esc(t.text)+'"'+dis()+'>'+(S.readOnly?'':'<button class="x" data-a="del-todo" data-e="'+e.id+'" data-t="'+t.id+'" aria-label="Remove to-do">'+I.x+'</button>')+'</div>'}
function jobBlock(e,j){const ss=signups(e).filter(s=>s.roleId===j.id),started=hasStarted(e),o=openFor(e,j);const base='events|'+e.id+'|roles.'+j.id;
 let h='<div class="job"><div class="job-head"><label class="f" for="j-'+j.id+'-n">Job<input type="text" id="j-'+j.id+'-n" data-b="'+base+'.name" value="'+esc(j.name)+'" placeholder="Greeter, Setup, Food table…"'+dis()+'></label><label class="f" for="j-'+j.id+'-k">People needed<input type="number" inputmode="numeric" min="0" step="1" id="j-'+j.id+'-k" data-b="'+base+'.needed" value="'+esc(j.needed==null?'':j.needed)+'"'+dis()+'></label>'+(S.readOnly?'<span></span>':'<button class="x" data-a="del-job" data-e="'+e.id+'" data-j="'+j.id+'" aria-label="Remove this job">'+I.x+'</button>')+'</div>';
 h+='<div class="job-times"><span>Times, if different from the event:</span><label class="sr" for="j-'+j.id+'-s">Job starts</label><input type="time" id="j-'+j.id+'-s" data-b="'+base+'.start" value="'+esc(j.start||'')+'"'+dis()+'><span>to</span><label class="sr" for="j-'+j.id+'-e">Job ends</label><input type="time" id="j-'+j.id+'-e" data-b="'+base+'.end" value="'+esc(j.end||'')+'"'+dis()+'></div>';
 h+='<div class="chips">'+(isPast(e)?'':(o?'<span class="chip open">'+plural(o,'spot','spots')+' open</span>':(Number(j.needed)?'<span class="chip ok">Filled</span>':'')))+'</div>';
 ss.forEach(s=>{h+='<div class="who"><span class="nm"><a href="#person.'+esc(s.personId)+'">'+esc(pname(s.personId))+'</a></span>';
  if(started){h+='<span class="seg" role="group" aria-label="Did '+esc(pname(s.personId))+' come?"><button data-a="came" data-e="'+e.id+'" data-s="'+s.id+'" data-v="came" aria-pressed="'+(s.status==='came')+'"'+dis()+'>Came</button><button data-a="came" data-e="'+e.id+'" data-s="'+s.id+'" data-v="missed" aria-pressed="'+(s.status==='missed')+'"'+dis()+'>Didn\'t come</button></span>';
   if(s.status==='came'){const dh=defaultHours(e,s);h+='<label class="sr" for="h-'+s.id+'">Hours</label><input class="hours" type="number" inputmode="decimal" min="0" step="0.25" id="h-'+s.id+'" data-b="events|'+e.id+'|signups.'+s.id+'.hours" value="'+esc(typeof s.hours==='number'?s.hours:'')+'" placeholder="'+(dh==null?'hours':hrs(dh))+'"'+dis()+'><span class="small sub">hours</span>'}}
  if(!S.readOnly)h+='<button class="x" data-a="del-signup" data-e="'+e.id+'" data-s="'+s.id+'" aria-label="Take '+esc(pname(s.personId))+' off this job">'+I.x+'</button>';
  h+='</div>'});
 if(!S.readOnly){const taken=new Set(ss.map(s=>s.personId));h+='<div class="adder"><label class="sr" for="add-'+j.id+'">Add someone to '+esc(j.name||'this job')+'</label><input type="text" id="add-'+j.id+'" list="dl-'+j.id+'" placeholder="Type a name to add someone" data-enter="add-signup" data-e="'+e.id+'" data-j="'+j.id+'" autocomplete="off"><datalist id="dl-'+j.id+'">'+all('people').filter(p=>!taken.has(p.id)&&!p.onBreak).sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(p=>'<option value="'+esc(p.name)+'">').join('')+'</datalist><button class="btn" data-a="add-signup" data-e="'+e.id+'" data-j="'+j.id+'">Add</button></div>'}
 return h+'</div>'}
function viewEvent(id){const d=S.data.events[id];if(!d||d.deleted)return backLink('events','Events')+'<p class="empty">This event is not here. It may have been deleted; look in More → Recently deleted.</p>';const e=Object.assign({id},d);const started=hasStarted(e);
 let h=backLink('events','Events')+'<div><label class="sr" for="ev-name">Event name</label><input class="title-input" type="text" id="ev-name" data-b="events|'+id+'|name" value="'+esc(e.name)+'" placeholder="Event name"'+dis()+'> '+exChip(e)+'</div>';

/* A sign-in sheet for the door: the jobs, the names signed up, blank lines for walk-ins, and a line for the total. Printed from the browser. */
function viewSheet(id){const d=S.data.events[id];if(!d||d.deleted)return backLink('events','Events');const e=Object.assign({id},d);
 const row=n=>'<tr><td>'+esc(n)+'</td><td></td><td></td><td></td></tr>';const blanks=n=>Array(n).fill('<tr><td>&nbsp;</td><td></td><td></td><td></td></tr>').join('');
 let h='<div class="noprint row-actions">'+backLink('event.'+id,'Back to the event')+'<button class="btn primary" data-a="print">Print</button></div><p class="noprint sub small">The jobs, the people signed up, and room for walk-ins. After the event, type what the sheet says back into the event: Came, and the hours.</p>';

function viewMore(){const L=[['hours','Volunteer hours','Hours given by each volunteer, for any dates. Copy into a spreadsheet or a report.'],['gifts','Gifts','Money and items given, promised and received.'],['board','For the board','The year in four lines: events, hours, volunteers and gifts. Copy it into a board update.'],['addmany','Add many volunteers at once','Paste a list from a spreadsheet or email.'],['backup','Backup','Save a copy of everything as a file, or bring one back.'],['settings','Settings','Your organization\'s name, text size, light or dark.'],['help','How to use this','A short guide and answers to common questions.'],['deleted','Recently deleted','Bring back anything you deleted.']];

function range(){const y=new Date().getFullYear();return {from:UI.from||y+'-01-01',to:UI.to||today()}}

function hoursRows(){const r=range(),by={};all('events').forEach(e=>{if(!e.date||e.date<r.from||e.date>r.to)return;signups(e).forEach(s=>{if(s.status!=='came')return;const k=s.personId;by[k]=by[k]||{name:pname(k),hours:0,events:new Set()};by[k].hours+=signupHours(e,s);by[k].events.add(e.id)})});return Object.values(by).map(x=>({name:x.name,events:x.events.size,hours:x.hours})).sort((a,b)=>b.hours-a.hours||a.name.localeCompare(b.name))}

function viewGifts(){const gs=giftRows();const rec=gs.filter(g=>g.type==='money'&&g.status==='received').reduce((n,g)=>n+(Number(g.amount)||0),0),pro=gs.filter(g=>g.type==='money'&&g.status!=='received').reduce((n,g)=>n+(Number(g.amount)||0),0);

async function saveFile(name,text,type){if(S.downloads){try{await S.downloads.save({filename:name,data:new Blob([text],{type})});return}catch(e){if(e&&(e.code==='declined'))return}}
 try{const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(e){toast('This browser blocked the file. Try “Copy for a spreadsheet” instead.')}}
function readBackup(f){UI.importFile=null;UI.importError='';if(!f){render(false);return}if(f.size>15e6){UI.importError='That file is too big to be a backup from this app.';render(false);return}

async function doRestore(){const j=UI.importFile;if(!j)return;UI.importFile=null;let added=0,updated=0;const todo=[];COLS.forEach(c=>Object.keys(j.data[c]||{}).forEach(id=>{const inc=j.data[c][id];if(!isObj(inc)||!/^[a-z0-9_-]{1,64}$/i.test(id))return;const cur=S.data[c][id];if(!cur)added++;else if(String(inc.updatedAt||'')>String(cur.updatedAt||''))updated++;else return;S.data[c][id]=clone(inc);todo.push([c,id])}));
 if(S.mode==='shared'){toast('Bringing back '+plural(todo.length,'record','records')+'…');for(const [c,id] of todo)await writeDoc(c,id)}else todo.forEach(([c,id])=>writeDoc(c,id));if(j.settings){let changed=false;if(j.settings.orgName&&!S.settings.orgName){S.settings.orgName=String(j.settings.orgName);changed=true}if(j.settings.hourValue!=null&&S.settings.hourValue==null){S.settings.hourValue=Number(j.settings.hourValue)||null;changed=true}if(changed)saveSettings()}prefs.welcomed=true;savePrefs();toast(plural(added,'record','records')+' added, '+updated+' updated.');go('home')}

function startLocal(note){const saved=lsGet(LS_DATA);if(saved&&isObj(saved.data)){COLS.forEach(c=>{S.data[c]=isObj(saved.data[c])?saved.data[c]:{}});if(isObj(saved.settings))S.settings=Object.assign(S.settings,saved.settings)}S.mode='local';S.ready=true;if(note)S.problem='';render()}
async function startShared(db){S.db=db;S.mode='shared';let got=0;const need=COLS.length+1;const done=()=>{if(++got===need){S.ready=true;render()}};
 COLS.forEach(c=>{let first=true;db.collection(c).onSnapshot(snap=>{const m={};snap.docs.forEach(doc=>{const v=clone(doc.data());const p=pending[c+'/'+doc.id];if(p)deepMerge(v,p);m[doc.id]=v});S.data[c]=m;if(first){first=false;done()}else soon()},err=>{S.problem='Lost the connection. Reload the page to see the latest.';paintStatus();if(first){first=false;done()}})});
 let firstS=true;db.doc('meta/settings').onSnapshot(snap=>{if(snap.exists){const v=snap.data()||{};if(!(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.set!=null))S.settings=Object.assign({orgName:''},clone(v))}if(firstS){firstS=false;done()}else soon()},()=>{if(firstS){firstS=false;done()}})}
