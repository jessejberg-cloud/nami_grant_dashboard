<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Grant Radar: a calm list of grant leads for NAMI Southeast Wisconsin.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%232e6a60%22%2F%3E%3Cpath%20d%3D%22M14%2044a24%2024%200%200%201%2036%200%22%20fill%3D%22none%22%20stroke%3D%22%23dcebe5%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%20opacity%3D%22.55%22%2F%3E%3Cpath%20d%3D%22M21%2044a15%2015%200%200%201%2022%200%22%20fill%3D%22none%22%20stroke%3D%22%23dcebe5%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%20opacity%3D%22.8%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2244%22%20r%3D%225%22%20fill%3D%22%23f2e6cf%22%2F%3E%3Cpath%20d%3D%22M32%2044l14-20%22%20stroke%3D%22%23f2e6cf%22%20stroke-width%3D%223.5%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<title>Grant Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Young+Serif&display=swap">
<style>/* Layout: a quiet left rail on wide screens, a bottom bar on phones; one
   column of content at reading width. Calm, muted, nothing red. */
:root{
  --bg:#edf0ea; --surface:#fafbf7; --sunk:#e3e8e0; --ink:#232e29; --muted:#5b6862; --line:#d3dacf;
  --accent:#2e6a60; --accent-ink:#ffffff; --accent-soft:#dcebe5;
  --soon:#8a6326; --soon-bg:#f2e6cf; --practice:#6d4f7a; --practice-bg:#ece3ef;
  --rail:#22332d; --rail-ink:#d8e3dc; --rail-muted:#9bb0a6; --rail-active:#34493f;
  --focus:#c48a3a; --shadow:0 1px 2px rgb(30 45 38 / .06), 0 8px 24px rgb(30 45 38 / .06);
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display:"Young Serif", Georgia, "Times New Roman", serif;
  --radius:12px; --pace:.28s;
  --size:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a18; --surface:#1d2420; --sunk:#232b27; --ink:#e2e8e3; --muted:#9ba8a1; --line:#313b36;
  --accent:#86bcaf; --accent-ink:#122019; --accent-soft:#273a33;
  --soon:#e0bd85; --soon-bg:#3a3122; --practice:#c9aed5; --practice-bg:#33293a;
  --rail:#101513; --rail-ink:#d8e3dc; --rail-muted:#8a9c93; --rail-active:#24302b;
  --focus:#e0aa5c; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a18; --surface:#1d2420; --sunk:#232b27; --ink:#e2e8e3; --muted:#9ba8a1; --line:#313b36;
  --accent:#86bcaf; --accent-ink:#122019; --accent-soft:#273a33;
  --soon:#e0bd85; --soon-bg:#3a3122; --practice:#c9aed5; --practice-bg:#33293a;
  --rail:#101513; --rail-ink:#d8e3dc; --rail-muted:#8a9c93; --rail-active:#24302b;
  --focus:#e0aa5c; --shadow:none; color-scheme:dark}
.gr-large{--size:20px}
.gr-still *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--size);line-height:1.55}
.gr-root{font-size:var(--size)}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0}
h1{font-family:var(--font-display);font-weight:400;font-size:1.9em;letter-spacing:-.01em}
h2{font-size:1.12em;font-weight:700}
h3{font-size:.95em;font-weight:700;margin-top:1.2em}
p{margin:.4em 0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip-link{position:fixed;left:1rem;top:-5rem;z-index:100;background:var(--surface);padding:.7rem 1rem;border-radius:8px}
.skip-link:focus{top:1rem}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:44px;padding:.55em 1em;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;color:var(--ink);font-weight:600;transition:background var(--pace)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent);padding-inline:.5em}
.btn.quiet:hover{background:var(--accent-soft)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}

/* Shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:1.6rem 1rem;display:flex;flex-direction:column;gap:1.4rem;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:.6rem;padding:0 .5rem;font-family:var(--font-display);font-size:1.35em}
.brand svg{width:34px;height:34px;flex:none}
.nav{display:grid;gap:.2rem}
.nav button{display:flex;align-items:center;gap:.7rem;width:100%;min-height:46px;padding:.5rem .8rem;border:0;border-radius:10px;background:transparent;color:var(--rail-muted);cursor:pointer;text-align:left;font-weight:600}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{color:var(--rail-ink);background:var(--rail-active)}
.nav button[aria-current="page"]{color:var(--rail-ink);background:var(--rail-active)}
.rail-foot{margin-top:auto;font-size:.78em;color:var(--rail-muted);padding:0 .5rem}
main{min-width:0;padding-block:2rem 5rem;padding-inline:clamp(16px,4vw,48px)}
.page{max-width:880px;margin:0 auto;display:grid;gap:1.4rem}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1rem}
.head p{color:var(--muted);margin-top:.35em;max-width:60ch}

/* Tip: one line, once, tapped away */
.tip{display:flex;gap:.8rem;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--radius);padding:.6rem .6rem .6rem 1rem;font-size:.92em}
.tip p{margin:0;flex:1}
.tip .row{flex:none;flex-wrap:nowrap;gap:.2rem}
.tip .btn{white-space:nowrap}

/* Panels: only where a group needs to read as one object */
.panel{background:var(--surface);border-radius:var(--radius);padding:1.2rem 1.3rem;box-shadow:var(--shadow);min-width:0}
.panel>h2{margin-bottom:.6rem}

/* A panel's heading, with its one door beside it */
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.4rem}
.panel-head h2{margin:0}
/* Progress through a few steps: a row of marks that fills, never "1 of 6" */
.dots{display:flex;gap:6px;margin-bottom:.5rem}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* Lead rows */
.list{display:grid}
.lead{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem 1rem;align-items:center;padding:.9rem .4rem;border-top:1px solid var(--line)}
.lead:first-child{border-top:0}
.lead:hover{background:var(--sunk);border-radius:8px}
.lead:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.lead .name{font-weight:700;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.lead .sub{color:var(--muted);font-size:.88em;grid-column:1}
.lead .when{grid-row:1 / span 2;grid-column:2;text-align:right;font-size:.9em;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:var(--soon);display:inline-block}
.tag{display:inline-flex;align-items:center;font-size:.72em;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.15em .55em;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.practice{background:var(--practice-bg);color:var(--practice)}
.tag.soon{background:var(--soon-bg);color:var(--soon)}
.tag.sent{background:var(--accent-soft);color:var(--accent)}
.when.soon{color:var(--soon);font-weight:700}
.empty{color:var(--muted);padding:1.2rem .4rem}

/* Filters */
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{min-height:40px;padding:.35em .9em;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:hover{border-color:var(--accent)}

/* Typing has one shape: words on a pen line, no box */
.field{display:grid;gap:.15rem;min-width:0}
.field>span{font-size:.82em;font-weight:700;color:var(--muted);letter-spacing:.02em}
.field small{color:var(--muted);font-size:.8em}
.pen{width:100%;border:0;border-bottom:1.5px solid var(--line);background:transparent;padding:.45em .1em;border-radius:0;min-height:44px;transition:border-color var(--pace)}
textarea.pen{resize:vertical;min-height:2.6em;line-height:1.5}
.pen:hover{border-bottom-color:var(--muted)}
.pen:focus{outline:none;border-bottom-color:var(--accent);border-bottom-width:2px}
.pen:focus-visible{outline:none}
select.pen{cursor:pointer}
.search{display:flex;align-items:center;gap:.5rem;border-bottom:1.5px solid var(--line)}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search .pen{border:0}
.search:focus-within{border-bottom-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem 1.4rem}
.full{grid-column:1/-1}
.form-error{color:var(--soon);font-weight:700;min-height:1.4em;margin:0}
.seg{display:flex;flex-wrap:wrap;gap:.4rem}

/* Lead detail */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
.fact{background:var(--surface);border-radius:var(--radius);padding:.8rem 1rem;box-shadow:var(--shadow);min-width:0}
.fact span{display:block;font-size:.78em;color:var(--muted);font-weight:700}
.fact strong{display:block;font-size:1.05em;overflow-wrap:anywhere}
.fact small{color:var(--muted)}
.reasons{display:grid;gap:.8rem;grid-template-columns:repeat(3,minmax(0,1fr))}
.reasons ul{margin:.3rem 0 0;padding-left:1.1em}
.reasons li{margin:.25rem 0}
.changed{background:var(--soon-bg);color:var(--ink);border-radius:var(--radius);padding:.8rem 1rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between}
dl.kv{margin:0;display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:.5rem 1rem}
dl.kv dt{color:var(--muted);font-size:.9em}
dl.kv dd{margin:0;overflow-wrap:anywhere}
details.more>summary{cursor:pointer;font-weight:700;color:var(--accent);min-height:44px;display:flex;align-items:center;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+";display:inline-block;width:1.2em;font-weight:700}
details.more[open]>summary::before{content:"–"}
.history{font-size:.88em;color:var(--muted);display:grid;gap:.35rem}

/* Send steps (a real sequence, so numbered) */
.steps{counter-reset:step;display:grid;gap:1rem}
.step{position:relative;padding-left:3rem}
.step::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:1.1rem;width:2rem;height:2rem;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.picklist{display:grid;max-height:22rem;overflow:auto}
.pick{display:flex;gap:.8rem;align-items:flex-start;padding:.6rem .2rem;border-top:1px solid var(--line);cursor:pointer}
.pick:first-child{border-top:0}
.pick input{width:1.25em;height:1.25em;margin-top:.2em;accent-color:var(--accent);flex:none}
.pick .sub{display:block;color:var(--muted);font-size:.85em}
.path{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-weight:700}
.path span{background:var(--sunk);padding:.2em .6em;border-radius:6px}
.path i{font-style:normal;color:var(--muted)}

/* Find grants */
.toggles{display:flex;flex-wrap:wrap;gap:.4rem}
.searches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.searches a{display:grid;gap:.1rem;padding:.9rem 1rem;border-radius:var(--radius);background:var(--accent-soft);text-decoration:none;color:var(--ink)}
.searches a strong{color:var(--accent)}
.searches a span{color:var(--muted);font-size:.85em;overflow-wrap:anywhere}
.searches a:hover{filter:brightness(.97)}

/* Help reader */
.reader{display:grid;grid-template-columns:200px minmax(0,1fr);gap:1.5rem;align-items:start}
.toc{position:sticky;top:1rem;display:grid;gap:.1rem}
.toc button{all:unset;cursor:pointer;padding:.35rem .6rem;border-radius:8px;font-size:.9em;color:var(--muted)}
.toc button:hover,.toc button[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.toc button:focus-visible{outline:3px solid var(--focus)}
.prose{max-width:66ch}
.prose h2{margin-top:1.6rem}
.prose h2:first-child{margin-top:0}
.prose ul,.prose ol{padding-left:1.2em}
.prose li{margin:.3rem 0}
ol.qs{padding:0;list-style:none;counter-reset:qs;display:grid;gap:.7rem}
ol.qs li{counter-increment:qs;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.6rem}
ol.qs li::before{content:counter(qs);width:2rem;height:2rem;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.settings-list{display:grid}
.setting{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:space-between;align-items:center;padding:.9rem 0;border-top:1px solid var(--line)}
.setting:first-child{border-top:0}
.setting p{margin:0;color:var(--muted);font-size:.9em;max-width:48ch}
.switch{position:relative;width:52px;height:30px;border-radius:999px;border:0;background:var(--line);cursor:pointer;flex:none;transition:background var(--pace)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform var(--pace)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.confirm{background:var(--soon-bg);border-radius:var(--radius);padding:.8rem 1rem}

/* Dialog */
.backdrop{position:fixed;inset:0;background:rgb(20 30 26 / .45);display:grid;place-items:center;padding:16px;z-index:50;animation:fade var(--pace) ease-out}
.dialog{width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:16px;padding:1.4rem;box-shadow:0 20px 60px rgb(0 0 0 / .25)}
.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}
.dialog-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.6rem;margin-top:1.2rem}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Tour: a ring around the thing it talks about, and a card beside it */
.tour-ring{position:fixed;z-index:60;border-radius:12px;box-shadow:0 0 0 4px var(--focus),0 0 0 9999px rgb(20 30 26 / .5);pointer-events:none;transition:all var(--pace) ease}
.tour-card{position:fixed;z-index:61;width:min(360px,calc(100vw - 32px));background:var(--surface);border-radius:16px;padding:1.1rem 1.2rem;box-shadow:0 20px 60px rgb(0 0 0 / .3)}
.tour-card h2{margin:.2rem 0 .4rem}
.tour-dim{position:fixed;inset:0;z-index:59;background:rgb(20 30 26 / .5)}

/* Toast with Undo */
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:70;display:flex;gap:.8rem;align-items:center;background:var(--rail);color:var(--rail-ink);border-radius:999px;padding:.45rem .5rem .45rem 1.1rem;max-width:calc(100vw - 32px);transition:opacity var(--pace),transform var(--pace)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .btn{min-height:38px;background:transparent;border-color:var(--rail-muted);color:var(--rail-ink)}

/* Phone: the rail becomes a bottom bar */
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;padding:.3rem .3rem calc(.3rem + env(safe-area-inset-bottom,0px));flex-direction:row;z-index:40;gap:0}
  .brand,.rail-foot{display:none}
  .nav{grid-template-columns:repeat(5,minmax(0,1fr));width:100%;gap:0}
  .nav button{flex-direction:column;gap:.1rem;font-size:.68em;min-height:54px;padding:.3rem .1rem;text-align:center;justify-content:center}
  main{padding-block:1.2rem 6.5rem}
  h1{font-size:1.55em}
  .facts,.reasons,.searches{grid-template-columns:minmax(0,1fr)}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .reader{grid-template-columns:minmax(0,1fr)}
  .toc{position:static;display:flex;flex-wrap:wrap}
  dl.kv{grid-template-columns:minmax(0,1fr)}
  dl.kv dd{margin-bottom:.4rem}
  .toast{bottom:5.5rem}
}
</style>
</head>
<body>
<div class="gr-root">
<a class="skip-link" href="#main">Skip to main content</a>
<div class="shell">
  <aside class="rail" aria-label="Main">
    <div class="brand"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#2e6a60"/><path d="M14 44a24 24 0 0 1 36 0" fill="none" stroke="#dcebe5" stroke-width="4" stroke-linecap="round" opacity=".55"/><path d="M21 44a15 15 0 0 1 22 0" fill="none" stroke="#dcebe5" stroke-width="4" stroke-linecap="round" opacity=".8"/><circle cx="32" cy="44" r="5" fill="#f2e6cf"/><path d="M32 44l14-20" stroke="#f2e6cf" stroke-width="3.5" stroke-linecap="round"/></svg><span>Grant Radar</span></div>
    <nav class="nav" id="nav" aria-label="Pages"></nav>
    <div class="rail-foot">NAMI Southeast Wisconsin<br>Saves as you go</div>
  </aside>
  <main id="main" tabindex="-1"><div id="content"><p style="padding:2rem">Loading Grant Radar…</p></div></main>
</div>
<div id="dialog-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<noscript><p style="padding:2rem">Grant Radar needs JavaScript turned on in your browser.</p></noscript>
<script>(function(){'use strict';
// Grant Radar logic. No DOM here, so the tests can import it directly and the
// build can inline it into the single-file app.

const VERSION = '2.1.0';
const REVISION_DATE = '2026-10-05';
const APP_ID = 'nami-grant-radar';
const DASHBOARD_URL = 'https://nami-grant-workspace.brainspottingonline.chatgpt.site';

const STORAGE = {
  opportunities: 'nami-radar-opportunities-v1',
  preferences: 'nami-radar-preferences-v1',
  onboarding: 'nami-radar-onboarding-v1',
  activity: 'nami-radar-activity-v1',
  settings: 'nami-radar-settings-v2'
};

// Stored status values are the Dashboard-facing names; STATUS_LABEL is the
// word on screen.
const statuses = ['New','Verification needed','Reviewing','Shortlisted','Declined','Archived','Closed'];
const STATUS_LABEL = {
  'New':'New',
  'Verification needed':'Needs checking',
  'Reviewing':'Looking into it',
  'Shortlisted':'Shortlisted',
  'Declined':'Not for us',
  'Archived':'Archived',
  'Closed':'Closed'
};
const PUT_AWAY = ['Declined','Archived','Closed'];
const sourceStates = ['CURRENT','STALE','UNKNOWN'];

const defaultPreferences = {
  geography: ['Milwaukee County','Ozaukee County','Washington County','Waukesha County','Wisconsin'],
  interests: ['Mental health','Peer support','Family education','Advocacy','Community outreach'],
  applicantTypes: ['501(c)(3) nonprofit','Fiscal sponsor permitted','Affiliate or chapter'],
  minimumAmount: 0,
  maximumAmount: 250000,
  deadlineHorizon: 180,
  exclusions: ['Invitation-only','Closed or expired','Partisan political activity'],
  keywords: 'mental health, peer support, family education, advocacy, community outreach'
};

const defaultSettings = {textSize:'standard', calm:false, tipsSeen:[], tipsLater:{}};

const base = {
  description: '', geography: '', applicantEligibility: '', programFit: '', fitReasons: [],
  gaps: [], disqualifiers: [], fundingMin: null, fundingMax: null, deadline: '',
  deadlineKind: 'unknown', deadlineTimezone: '', applicationRoute: '', matchingFunds: 'Unknown',
  restrictions: '', owner: '', status: 'New', notes: '', nextAction: '', checkedAt: '',
  sourceState: 'UNKNOWN', sourceType: 'official', recordType: 'public', changeFlags: [], history: [],
  sentAt: ''
};

const initialOpportunities = [

function clone(value){ return JSON.parse(JSON.stringify(value)); }
function normalize(value=''){ return String(value??'').trim().toLowerCase().replace(/\s+/g,' '); }

// The person's own calendar day, not UTC: at 8 pm in Milwaukee UTC is already
// tomorrow, and a deadline would tip a day early.
function localToday(now=new Date()){
  const p=n=>String(n).padStart(2,'0');
  return `${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}`;
}
function daysBetween(fromISO,toISO){ return Math.round((Date.parse(toISO.slice(0,10))-Date.parse(fromISO.slice(0,10)))/86400000); }

function blankLead(){
  return {...clone(base), id:'', externalId:'', title:'', funder:'', officialUrl:'', recordType:'public'};
}

function stableKey(item){ return item.externalId ? `id:${normalize(item.externalId)}` : `source:${normalize(item.officialUrl)}|title:${normalize(item.title)}`; }
function findDuplicate(items, candidate, ignoreId=''){
  const url=String(candidate.officialUrl||'').trim();
  return items.find(x=>x.id!==ignoreId && (
    (candidate.externalId && x.externalId && normalize(candidate.externalId)===normalize(x.externalId)) ||
    (url && normalize(x.title)===normalize(candidate.title) && String(x.officialUrl||'').trim()===url)
  )) || null;
}

function dateState(item, today=localToday()){
  if(item.status==='Closed'||item.sourceAvailability==='closed') return 'CLOSED';
  if(item.deadlineKind==='rolling') return 'ROLLING';
  if(item.deadlineKind==='unknown'||!item.deadline) return 'UNKNOWN';
  if(item.deadline<today) return 'CLOSED';
  return daysBetween(today,item.deadline)<=30 ? 'APPROACHING' : 'CONFIRMED';
}
function daysLeft(item,today=localToday()){
  if(item.deadlineKind!=='confirmed'||!item.deadline||item.deadline<today) return null;
  return daysBetween(today,item.deadline);
}

function fitExplanation(item){
  const positives=item.fitReasons?.length||0, unknowns=item.gaps?.length||0, blocks=item.disqualifiers?.length||0;
  return {positives,unknowns,blocks,label:blocks?'Has a deal-breaker':!positives?'Fit not looked at yet':unknowns?'Promising, with questions':'Promising'};
}

function sourceFreshness(item,today=localToday()){
  if(!item.checkedAt || !Number.isFinite(Date.parse(item.checkedAt)) || item.sourceState==='UNKNOWN')return 'UNKNOWN';
  return item.sourceState==='STALE'||daysBetween(item.checkedAt,today)>30?'STALE':'CURRENT';
}
function needsChecking(item){
  return item.status==='Verification needed' || (!PUT_AWAY.includes(item.status) && (sourceFreshness(item)!=='CURRENT' || (item.changeFlags||[]).length>0));
}

function safeSource(url){try{return ['https:','http:'].includes(new URL(url).protocol)?url:''}catch{return ''}}

function validateOpportunity(item){
  if(!String(item.title||'').trim()||item.title.length>180)throw Error('Give the lead a name (up to 180 characters).');
  if(item.officialUrl&&!safeSource(item.officialUrl))throw Error('The link should start with https:// (copy it from the funder\'s page).');
  if((item.externalId||'').length>100)throw Error('The lead ID can be at most 100 characters.');
  if(item.deadlineKind==='confirmed'&&!item.deadline)throw Error('Pick the deadline date, or choose "Rolling" or "Not sure".');
  if(item.deadline&&(!/^\d{4}-\d{2}-\d{2}$/.test(item.deadline)||!Number.isFinite(Date.parse(item.deadline))||new Date(item.deadline).toISOString().slice(0,10)!==item.deadline))throw Error('That deadline is not a real date.');
  for(const k of ['fundingMin','fundingMax'])if(item[k]!=null&&(!Number.isFinite(item[k])||item[k]<0||item[k]>1e9))throw Error('Amounts go from $0 to $1 billion.');
  if(item.fundingMin!=null&&item.fundingMax!=null&&item.fundingMin>item.fundingMax)throw Error('The smallest amount is bigger than the largest. Swap them?');
  if((item.owner||'').length>120)throw Error('The owner name can be at most 120 characters.');
  return item;
}

function researchBrief(p){return `Area: ${p.geography.join(', ')||'Anywhere'}\nTopics: ${p.interests.join(', ')||'Any'}\nWho can apply: ${p.applicantTypes.join(', ')||'Any'}\nAmount: $${p.minimumAmount}–$${p.maximumAmount}\nLooking ahead: ${p.deadlineHorizon} days\nSkip: ${p.exclusions.join(', ')||'Nothing'}\nWords: ${p.keywords}`}

function searchLinks(p){
  const words=String(p.keywords||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,3);
  const topic=(words.length?words:p.interests.slice(0,2)).join(' OR ');
  const area=p.geography.find(g=>g!=='United States')||'';
  const q=s=>encodeURIComponent(s);
  return [
    {label:'Search the web',hint:`${topic} grant ${area}`.trim(),url:`https://www.google.com/search?q=${q(`(${topic}) grant ${area} nonprofit`)}`},
    {label:'Search federal grants (Grants.gov)',hint:'Federal funding, all states',url:`https://www.grants.gov/search-grants?keywords=${q(words[0]||'mental health')}`},
    {label:'Greater Milwaukee Foundation',hint:'Local funding opportunities',url:'https://www.greatermilwaukeefoundation.org/grantseekers/funding-opportunities/'},
    {label:'Wisconsin foundations',hint:`${area||'Wisconsin'} community foundation grants`,url:`https://www.google.com/search?q=${q(`${area||'Wisconsin'} community foundation grant ${words[0]||'mental health'}`)}`}
  ];
}

// ---- Grant Dashboard hand-off ---------------------------------------------
// The Dashboard's importer (lib/records.ts validate + api/records import)
// accepts schemaVersion 1-3, 1-100 records, and REFUSES THE WHOLE FILE if any
// one record matches an existing kind + title + source. That is why the app
// remembers sentAt and leaves sent leads out by default.

const DASHBOARD_STATUS={New:'New','Verification needed':'Reviewing',Reviewing:'Reviewing',Shortlisted:'Reviewing',Declined:'Declined',Archived:'Archived',Closed:'Archived'};

function toGrantDashboardRecord(item,today=localToday()){
  const lines=[
    `Grant Radar ID: ${item.externalId||item.id}`,
    `Radar status: ${STATUS_LABEL[item.status]||item.status}`,
    `Kind of lead: ${item.recordType==='sample'?'PRACTICE (made up)':'Real, public lead. Eligibility not confirmed.'}`,
    `Funder: ${item.funder||'Unknown'}`,
    `Area: ${item.geography||'Unknown'}`,
    `Who can apply: ${item.applicantEligibility||'Unknown'}`,
    `Fit: ${item.programFit||'Not looked at yet'}`,
    `Why it might fit: ${(item.fitReasons||[]).join('; ')||'None noted'}`,
    `Still to find out: ${(item.gaps||[]).join('; ')||'None noted'}`,
    `Deal-breakers: ${(item.disqualifiers||[]).join('; ')||'None noted'}`,
    `Deadline: ${item.deadlineKind==='confirmed'?item.deadline:item.deadlineKind==='rolling'?'Rolling':'Not sure'}${item.deadlineTimezone?` (${item.deadlineTimezone})`:''}`,
    `How to apply: ${item.applicationRoute||'Unknown'}`,
    `Matching funds: ${item.matchingFunds||'Unknown'}`,
    `Restrictions: ${item.restrictions||'None noted'}`,
    `Funding range: ${item.fundingMin??'?'} to ${item.fundingMax??'?'} USD`,
    `Last checked: ${item.checkedAt?item.checkedAt.slice(0,10):'Never'}`,
    `Description: ${item.description||''}`,
    `Next step: ${item.nextAction||'Not set'}`,
    '', item.notes||''
  ];
  const notes=lines.join('\n');
  if(notes.length>10000)throw Error(`"${item.title}" has more notes than the Dashboard accepts (10,000 characters). Shorten its notes and try again.`);
  validateOpportunity(item);
  const checked=(item.checkedAt||'').slice(0,10);
  return {id:String(item.externalId||item.id).slice(0,100),kind:'opportunity',title:item.title.trim(),owner:item.owner||'',grant:'',
    due:item.deadlineKind==='confirmed'?item.deadline:'',status:DASHBOARD_STATUS[item.status]||'Reviewing',
    amount:Number(item.fundingMax??item.fundingMin??0),spent:0,source:safeSource(item.officialUrl||'')?item.officialUrl.trim():'',notes,
    demo:item.recordType==='sample',updated:'',verifiedOn:checked&&checked<=today?checked:''};
}
function buildExport(items){
  if(!items.length)throw Error('Pick at least one lead to send.');
  if(items.length>100)throw Error('The Dashboard takes up to 100 leads at a time. Pick fewer.');
  if(new Set(items.map(i=>i.recordType)).size>1)throw Error('Send practice leads on their own, so they land in the Dashboard\'s Sample workspace.');
  const records=items.map(i=>toGrantDashboardRecord(i));
  if(new Set(records.map(r=>r.id)).size!==records.length)throw Error('Two picked leads share an ID. Open one and change its ID under More details.');
  const keys=records.map(r=>r.kind+'|'+r.title.toLowerCase()+'|'+r.source);
  if(new Set(keys).size!==keys.length)throw Error('Two picked leads have the same name and link. The Dashboard would refuse the file.');
  return {schemaVersion:2,demo:items[0].recordType==='sample',exportedAt:new Date().toISOString(),sourceSystem:'Nami Grant Radar',sourceVersion:VERSION,records};
}
function exportFileName(items,today=localToday()){
  return `grant-radar-${items[0]?.recordType==='sample'?'practice-':''}${items.length}-lead${items.length===1?'':'s'}-${today}.json`;
}

// ---- Backups and bringing leads in ----------------------------------------

function makeBackup(state){
  return {app:APP_ID,kind:'backup',version:VERSION,savedAt:new Date().toISOString(),
    opportunities:state.items,preferences:state.preferences,activity:state.activity||[]};
}

function fromDashboardRecord(r){
  const lead=blankLead();
  const status={New:'New',Reviewing:'Reviewing',Applying:'Shortlisted',Declined:'Declined',Archived:'Archived'}[r.status]||'New';
  const idLine=/Grant Radar(?: external)? ID: (.+)/.exec(r.notes||'');
  return {...lead,externalId:(idLine?idLine[1].trim():'').slice(0,100),title:String(r.title||'').trim(),officialUrl:r.source||'',owner:r.owner||'',
    deadline:r.due||'',deadlineKind:r.due?'confirmed':'unknown',fundingMax:Number(r.amount)>0?Number(r.amount):null,status,
    notes:String(r.notes||''),recordType:r.demo?'sample':'public',checkedAt:r.verifiedOn?r.verifiedOn+'T12:00:00Z':'',
    sourceState:r.verifiedOn?'CURRENT':'UNKNOWN',
    // A lead that came FROM the Dashboard is already there: sending it back
    // would make the Dashboard refuse the whole file.
    sentAt:new Date().toISOString()};
}

// Reads a Radar backup, a Radar export, or a Grant Dashboard export/template.
// Adds what is new, never overwrites, and says what it skipped and why.
function readImport(text, existing, makeId=()=>crypto.randomUUID()){
  let data;
  try{data=JSON.parse(text)}catch{throw Error('This file is not one Grant Radar can read. Choose a .json file saved from Grant Radar or the Grant Dashboard.')}
  let incoming=[], kind='leads', preferences=null;
  if(data&&data.app===APP_ID&&Array.isArray(data.opportunities)){incoming=data.opportunities;kind='backup';preferences=data.preferences||null}
  else if(data&&Array.isArray(data.records)){
    const opp=data.records.filter(r=>r&&r.kind==='opportunity');
    if(!opp.length)throw Error('This file has no grant leads in it. (Awards and tasks from the Dashboard stay in the Dashboard.)');
    incoming=opp.map(fromDashboardRecord);kind=data.sourceSystem==='Nami Grant Radar'?'export':'dashboard';
  }
  else if(Array.isArray(data)){incoming=data}
  else throw Error('This file has no grant leads in it.');
  const added=[],skipped=[],problems=[];
  const pool=[...existing];
  for(const raw of incoming){
    if(!raw||typeof raw!=='object'){problems.push('One entry was not a lead.');continue}
    const item={...blankLead(),...raw};
    for(const k of ['fitReasons','gaps','disqualifiers','history','changeFlags'])if(!Array.isArray(item[k]))item[k]=[];
    for(const k of ['title','funder','officialUrl','externalId','owner','notes','nextAction','description'])item[k]=item[k]==null?'':String(item[k]);
    for(const k of ['fundingMin','fundingMax'])item[k]=item[k]===''||item[k]==null?null:Number(item[k]);
    if(!statuses.includes(item.status))item.status='New';
    if(!['public','sample'].includes(item.recordType))item.recordType='public';
    try{validateOpportunity(item)}catch(e){problems.push(`${item.title||'A lead with no name'}: ${e.message}`);continue}
    if(findDuplicate(pool,item)||(item.id&&pool.some(x=>x.id===item.id&&normalize(x.title)===normalize(item.title)))){skipped.push(item.title);continue}
    if(!item.id||pool.some(x=>x.id===item.id))item.id=makeId();
    pool.push(item);added.push(item);
  }
  return {kind,added,skipped,problems,preferences};
}

function mergeRefresh(existing, incoming){
  const changed=[];
  const watched=['deadline','deadlineKind','deadlineTimezone','fundingMin','fundingMax','restrictions','applicationRoute','sourceState','sourceAvailability'];
  for(const key of watched) if(JSON.stringify(existing[key]??null)!==JSON.stringify(incoming[key]??null)) changed.push(key);
  return {...existing,...incoming,id:existing.id,owner:existing.owner,status:existing.status,notes:existing.notes,nextAction:existing.nextAction,
    history:[...(existing.history||[]),...(changed.length?[{at:new Date().toISOString(),type:'source-refresh',changed,previous:Object.fromEntries(changed.map(k=>[k,existing[k]]))}]:[])],
    changeFlags:[...new Set([...(existing.changeFlags||[]),...changed])]
  };
}

<p><strong>Why it might fit</strong>, <strong>Still to find out</strong> and <strong>Deal-breakers</strong> spell out the reasoning. Radar never gives a lead a hidden score. A promising lead can still turn out not to suit us.</p>
<p><strong>More details</strong> opens the rest: who can apply, area, how to apply, matching funds, restrictions and time zone.</p>`},
  {id:'add', title:'Adding and editing a lead', html:`
<p>Tap <strong>+ Add a lead</strong>. Only the name is needed. If you can, add the funder, the link to the funder's page, the deadline and the amount.</p>
<p>For the deadline, choose <strong>Date</strong>, <strong>Rolling</strong> (they accept applications any time) or <strong>Not sure</strong>.</p>
<p><strong>More details</strong> holds the rest, including the reasons it might fit and what is still unknown. Put one item per line.</p>
<p>If a lead with the same ID, or the same name and link, already exists, Radar says so and opens nothing new. That keeps your notes in one place.</p>
<p>To edit later, open the lead and tap <strong>Edit details</strong>.</p>`},
  {id:'check', title:'Checking the funder\'s page', html:`
<p>Funders change dates and amounts. When you have read a funder's page, open the lead and tap <strong>I checked the page</strong>. Note the date you looked and anything you saw: the deadline, the amount, whether it is open, how to apply.</p>
<p>If the deadline, amount, time zone, restrictions or way to apply changed, Radar marks the lead <strong>changed</strong> and says what changed. Your notes, owner, status and next step are never overwritten. Tap <strong>OK, noted</strong> to clear the mark.</p>
<p>A page not checked for more than 30 days shows <strong>Time for a fresh look</strong>.</p>`},
  {id:'put-away', title:'Putting a lead away, and undo', html:`
<p>Tap <strong>Archive</strong> to put a lead away. A message appears with <strong>Undo</strong>. Archived leads are kept; find them under <strong>Put away</strong> on the Leads page and change their status to bring them back.</p>
<p>Nothing in Radar is deleted for good.</p>`},
  {id:'find', title:'Finding new grants', html:`
<p>The <strong>Find grants</strong> page holds your search preferences: area, topics, who can apply, amount, what to skip, and search words. Tap to turn each one on or off. They save straight away.</p>
<p>The search buttons open a ready-made search in a new tab: the web, Grants.gov, the Greater Milwaukee Foundation, and Wisconsin community foundations. When you find something, come back and add it as a lead.</p>
<p>Radar does not search on its own. A weekly automatic search needs the agency to set up its own account and scheduler. Until then, searching is done by people, using these buttons.</p>
<p>Preferences are not facts about the agency. Whether we qualify is always checked on the funder's page.</p>`},
  {id:'send', title:'Sending leads to the Grant Dashboard', html:`
<p>The <strong>Send</strong> page moves leads into the Grant Dashboard in three steps:</p>
<ol><li><strong>Pick leads.</strong> Shortlisted and in-progress leads that have not been sent are ticked for you. Change the ticks as you like.</li><li><strong>Save the file.</strong> Tap <strong>Save the file</strong>. Radar saves a small .json file and marks those leads <strong>Sent</strong>.</li><li><strong>Import it in the Dashboard.</strong> Tap <strong>Open the Grant Dashboard</strong>. There, go to <strong>Settings</strong>, choose the <strong>Agency</strong> workspace (or <strong>Sample</strong> for practice leads), tap <strong>Import records</strong> and choose the file.</li></ol>
<p>Why Radar leaves Sent leads out: the Dashboard turns away the whole file if even one lead in it is already there. If you need to send one again, tick it by hand. Delete the old copy in the Dashboard first.</p>
<p>Practice leads are sent on their own, so they land in the Dashboard's Sample workspace and never mix with real ones.</p>
<p>A lead sent to the Dashboard is still a lead. It does not become an award there until someone decides it is one.</p>`},
  {id:'data', title:'Where your work is saved', html:`
<p>Radar saves as you go. When you open it through a Claude link while signed in, your leads are also kept with your Claude account, so they follow you to another computer. Otherwise they are saved in this browser on this computer.</p>
<p>Clearing your browser's data, using a private window, or switching browsers can hide leads saved only in the browser. So once in a while, go to <strong>Help</strong>, then <strong>Your data</strong>, and tap <strong>Save a backup</strong>.</p>
<p><strong>Open a file</strong> reads a Radar backup, a Radar send file, or a Grant Dashboard export. It adds leads you do not have and skips the ones you do. It never overwrites.</p>
<p><strong>Start fresh</strong> puts the starting leads back. It asks first, and offers Undo.</p>`},
  {id:'comfort', title:'Making it comfortable', html:`
<p>In Help, under <strong>Your data and comfort</strong>:</p>
<ul><li><strong>Larger text</strong> makes every word bigger.</li><li><strong>Still screen</strong> turns off movement and fades.</li></ul>
<p>Radar also follows your device's dark mode and reduced-motion settings.</p>`},
  {id:'trouble', title:'If something goes wrong', html:`
<ul><li><strong>My leads are gone.</strong> You may be in a different browser, a private window, or the browser's data was cleared. Open your latest backup with <strong>Open a file</strong>.</li><li><strong>The Dashboard says "A matching record is already present".</strong> One lead in the file is already in the Dashboard. Go back to Send, untick that lead, save again, and import the new file.</li><li><strong>The Dashboard says "Unable to read this file".</strong> Make sure you picked the .json file Radar saved, not a different file.</li><li><strong>The save button did nothing.</strong> Some viewers ask before saving a file. Look for a confirmation box. If none appears, use <strong>Copy instead</strong>, paste into a text file, and save it with a name ending in .json.</li><li><strong>Radar says a lead already exists.</strong> Open the existing lead instead, so all notes stay together.</li></ul>`},
  {id:'limits', title:'What Radar does not do yet', html:`
<ul><li>It does not search the web on its own. Weekly automatic searching needs agency setup: a scheduler, accounts, a shared database, and someone responsible for it.</li><li>It is not shared between staff. Each person's Radar is their own. Use the Grant Dashboard as the shared place.</li><li>It does not check eligibility. A person reads the funder's rules.</li><li>It is not built for private information. Use public information only.</li></ul>`}
];

const GLOSSARY = [
  ['Lead','A grant that might suit us. Not an application and not an award.'],
  ['Practice lead','A made-up lead for learning. It has a purple Practice tag.'],
  ['Rolling','The funder accepts applications at any time.'],
  ['Needs checking','Something about this lead is still unknown, or its page has not been looked at for a while.'],
  ['Shortlisted','Worth pursuing. Usually the next stop is the Grant Dashboard.'],
  ['Put away','Leads marked Not for us, Archived or Closed. Kept, out of the way.'],
  ['Sent','Already saved in a file for the Grant Dashboard.'],
  ['Deal-breaker','Something that rules this lead out, like a closed cycle.'],
  ['Backup','A file holding all your leads and preferences, to keep safe or move to another computer.']
];

// Grant Radar interface. The build inlines core.mjs and guides.mjs above this
// file inside one closure, so every name they export is in scope here.

/* global VERSION REVISION_DATE APP_ID DASHBOARD_URL STORAGE statuses STATUS_LABEL PUT_AWAY defaultPreferences defaultSettings
   initialOpportunities clone normalize localToday daysBetween blankLead findDuplicate dateState daysLeft fitExplanation
   sourceFreshness needsChecking safeSource validateOpportunity searchLinks buildExport exportFileName makeBackup readImport
   mergeRefresh FIELD_LABEL TOUR TIPS QUICK_START MANUAL GLOSSARY */

// ---------------------------------------------------------------- storage --
// Saved in this browser always; also with the person's Claude account when
// the page runs as a Claude link and they are signed in, so work follows them.
const local={
  get(k){try{return localStorage.getItem(k)}catch{return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch{return false}}
};
const KEY_NAME=Object.fromEntries(Object.entries(STORAGE).map(([n,k])=>[k,n]));
function load(key,fallback){const raw=local.get(key);if(raw==null)return clone(fallback);try{return JSON.parse(raw)}catch{return clone(fallback)}}
const cloud={db:null,uid:null,pending:{},busy:{},timer:{},tooBig:false,refused:false};
const caps={downloads:null,ready:Promise.resolve()};
let storageOK=true;

function save(key,value){
  const text=JSON.stringify(value), at=new Date().toISOString();
  const ok=local.set(key,text);local.set(key+':at',at);
  if(!ok&&storageOK&&!cloud.db){storageOK=false;toast('This browser is not keeping changes. Save a backup from Help before you close the page.')}
  cloudWrite(key,value,at);
}
function cloudWrite(key,value,savedAt){
  if(!cloud.db||cloud.refused)return;
  const name=KEY_NAME[key];
  if(JSON.stringify(value).length>240000){if(!cloud.tooBig){cloud.tooBig=true;toast('Too many leads to keep with your account. They are still saved in this browser; save a backup from Help.')}return}
  cloud.pending[name]={value,savedAt};
  clearTimeout(cloud.timer[name]);cloud.timer[name]=setTimeout(()=>flush(name),500);
}
async function flush(name){
  if(cloud.busy[name]||!cloud.pending[name])return;
  const body=cloud.pending[name];delete cloud.pending[name];cloud.busy[name]=true;
  try{await cloud.db.doc(`data/users/${cloud.uid}/${name}`).set(body)}
  catch(e){if(e&&e.code==='invalid_argument'){cloud.refused=true}}
  finally{cloud.busy[name]=false;if(cloud.pending[name])flush(name)}
}
async function connectCloud(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  try{
    caps.ready=window.claude.use('downloads').then(d=>{caps.downloads=d}).catch(()=>{});
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    cloud.db=db;cloud.uid=uid;
    let changed=false;
    for(const [name,key] of Object.entries(STORAGE)){
      const snap=await db.doc(`data/users/${uid}/${name}`).get();
      const localAt=local.get(key+':at')||'', localRaw=local.get(key);
      if(snap.exists){
        const d=snap.data()||{};
        if(String(d.savedAt||'')>localAt){applyStored(name,d.value);local.set(key,JSON.stringify(d.value));local.set(key+':at',String(d.savedAt));changed=true}
        else if(localRaw&&localAt>String(d.savedAt||'')){try{cloudWrite(key,JSON.parse(localRaw),localAt)}catch{}}
      }else if(localRaw){try{cloudWrite(key,JSON.parse(localRaw),localAt||new Date().toISOString())}catch{}}
    }
    if(changed&&!document.querySelector('.dialog'))render();
    else if(S.tab==='Help')render();
  }catch{/* the page works the same without an account */}
}
function applyStored(name,value){
  if(name==='opportunities'&&Array.isArray(value))S.items=value;
  if(name==='preferences'&&value)S.preferences={...clone(defaultPreferences),...value};
  if(name==='activity'&&Array.isArray(value))S.activity=value;
  if(name==='settings'&&value){S.settings={...clone(defaultSettings),...value};applyComfort()}
  if(name==='onboarding'&&value){S.onboarded=true;if(S.tour>=0)endTour(false)}
}

// ------------------------------------------------------------------ state --
const S={
  tab:'Home',selected:null,
  items:load(STORAGE.opportunities,initialOpportunities),
  preferences:{...clone(defaultPreferences),...load(STORAGE.preferences,defaultPreferences)},
  activity:load(STORAGE.activity,[]),
  settings:{...clone(defaultSettings),...load(STORAGE.settings,defaultSettings)},
  onboarded:local.get(STORAGE.onboarding)!=null,
  query:'',filter:'Active',helpView:'start',manualAt:MANUAL[0].id,
  sendKind:'public',picks:null,lastSent:null,confirmFresh:false,
  tour:-1,draft:null,undo:null
};
const $=s=>document.querySelector(s);
const esc=(s='')=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const byId=id=>S.items.find(i=>i.id===id);
function persist(){save(STORAGE.opportunities,S.items)}
function log(action,item,details=''){S.activity.unshift({at:new Date().toISOString(),action,itemId:item?.id||'',title:item?.title||'',details});S.activity=S.activity.slice(0,100);save(STORAGE.activity,S.activity)}
function newId(){try{return crypto.randomUUID()}catch{return 'lead-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}}

// ----------------------------------------------------------------- format --
function fmtDate(iso,opts={}){if(!iso)return '';const d=new Date(iso.length===10?iso+'T12:00:00':iso);if(!Number.isFinite(d.getTime()))return '';const sameYear=d.getFullYear()===new Date().getFullYear();return d.toLocaleDateString('en-US',{month:'short',day:'numeric',...(sameYear&&!opts.year?{}:{year:'numeric'})})}
function money(i){const f=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);if(i.fundingMin==null&&i.fundingMax==null)return '';if(i.fundingMin!=null&&i.fundingMax!=null&&i.fundingMin!==i.fundingMax)return `${f(i.fundingMin)} – ${f(i.fundingMax)}`;return (i.fundingMin==null?'Up to ':'')+f(i.fundingMax??i.fundingMin)}
function whenText(i){
  const ds=dateState(i),n=daysLeft(i);
  if(ds==='CLOSED')return {main:'Closed',sub:i.deadline?fmtDate(i.deadline,{year:true}):'',soon:false};
  if(ds==='ROLLING')return {main:'Rolling',sub:'Apply any time',soon:false};
  if(ds==='UNKNOWN')return {main:'Date not known',sub:'',soon:false};
  return {main:fmtDate(i.deadline),sub:n===0?'Today':n===1?'Tomorrow':`${n} days`,soon:n<=30};
}
function checkedText(i){
  const f=sourceFreshness(i);
  if(f==='UNKNOWN')return {main:'Not checked yet',sub:'Open the funder\'s page to check'};
  return {main:fmtDate(i.checkedAt),sub:f==='STALE'?'Time for a fresh look':'Checked recently'};
}
function sortLeads(list){
  const rank=i=>{const ds=dateState(i);return ds==='CLOSED'?3:ds==='UNKNOWN'?2:ds==='ROLLING'?1:0};
  return [...list].sort((a,b)=>rank(a)-rank(b)||(a.deadline||'').localeCompare(b.deadline||'')||a.title.localeCompare(b.title));
}
const active=()=>S.items.filter(i=>!PUT_AWAY.includes(i.status));
const FILTERS={
  'Active':i=>!PUT_AWAY.includes(i.status),
  'Due in 30 days':i=>!PUT_AWAY.includes(i.status)&&daysLeft(i)!=null&&daysLeft(i)<=30,
  'Needs checking':i=>needsChecking(i),
  'Shortlisted':i=>i.status==='Shortlisted',
  'Put away':i=>PUT_AWAY.includes(i.status),
  'All':()=>true
};

// ------------------------------------------------------------------ icons --
const ICON={
  Home:'<path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/>',
  Leads:'<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  'Find grants':'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  Send:'<path d="M4 12l16-8-6 16-3-7z"/><path d="M11 13l9-9"/>',
  Help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7"/><circle cx="12" cy="17.2" r=".6"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>'
};
const svg=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;
const TABS=['Home','Leads','Find grants','Send','Help'];
const TAB_LABEL={Home:'Home',Leads:'Leads','Find grants':'Find grants',Send:'Send',Help:'Help'};

// ------------------------------------------------------------------ pages --
// One line per page, until put away. Got it puts it away for good; Later
// brings it back tomorrow.
function tip(tab){
  if(!TIPS[tab]||S.settings.tipsSeen.includes(tab))return '';
  const later=(S.settings.tipsLater||{})[tab];if(later&&Date.now()<later)return '';
  return `<div class="tip" role="note"><p>${esc(TIPS[tab])}</p><span class="row"><button class="btn quiet" data-act="tip-later" data-arg="${esc(tab)}">Later</button><button class="btn quiet" data-act="tip-ok" data-arg="${esc(tab)}">Got it</button></span></div>`;
}
function head(title,sub,action=''){return `<div class="head"><div><h1 id="page-title" tabindex="-1">${title}</h1>${sub?`<p>${sub}</p>`:''}</div>${action}</div>`}
const addBtn=`<button class="btn primary" data-act="add" data-tour="add-lead">+ Add a lead</button>`;

// Home is three short lists, headings at a glance: the names of the leads,
// never a number of them. A number on a pile reads as a backlog.
function home(){
  const act=active();
  const horizon=Number(S.preferences.deadlineHorizon)||180;
  const coming=sortLeads(act.filter(i=>{const n=daysLeft(i);return n!=null&&n<=horizon}));
  const check=sortLeads(act.filter(needsChecking));
  const short=sortLeads(act.filter(i=>i.status==='Shortlisted'));
  const panel=(title,filter,list,showNext,none)=>`<section class="panel"><div class="panel-head"><h2>${title}</h2>${list.length?`<button class="btn quiet" data-act="see" data-arg="${filter}">See all</button>`:''}</div><div class="list">${list.slice(0,4).map(i=>row(i,showNext)).join('')||`<p class="empty">${none}</p>`}</div></section>`;
  return `${head('Grant Radar','What is coming up, and what to look at next.',addBtn)}${tip('Home')}
  ${panel('Coming up','Due in 30 days',coming,false,'No dates coming up.')}
  ${panel('Needs checking','Needs checking',check,true,'Nothing to check.')}
  ${panel('Shortlisted','Shortlisted',short,false,'Nothing shortlisted.')}`;
}
function row(i,showNext=false){
  const w=whenText(i);
  const tags=`${i.recordType==='sample'?'<span class="tag practice">Practice</span>':''}${i.sentAt?'<span class="tag sent">Sent</span>':''}${i.changeFlags?.length?'<span class="dot" title="Changed since you last looked"></span><span class="sr-only">Changed since you last looked</span>':''}`;
  const sub=showNext&&i.nextAction?`Next: ${esc(i.nextAction)}`:`${esc(i.funder||'Funder not noted')}${i.owner?` · ${esc(i.owner)}`:''}`;
  return `<button class="lead" data-act="open" data-arg="${esc(i.id)}"><span class="name">${esc(i.title)} ${tags}</span><span class="sub">${sub}</span><span class="when ${w.soon?'soon':''}">${esc(w.main)}${w.sub?`<br><small>${esc(w.sub)}</small>`:''}</span></button>`;
}

function leads(){
  if(S.selected){const i=byId(S.selected);if(i)return detail(i);S.selected=null}
  return `${head('Leads','Every grant you are keeping an eye on, soonest first.',addBtn)}${tip('Leads')}
  <label class="search"><span class="sr-only">Search leads</span>${svg('search')}<input id="q" class="pen" type="search" autocomplete="off" placeholder="Search names, funders, owners, notes" value="${esc(S.query)}"></label>
  <div class="chips" role="group" aria-label="Show">${Object.keys(FILTERS).map(f=>`<button class="chip" data-act="filter" data-arg="${f}" aria-pressed="${S.filter===f}">${f}</button>`).join('')}</div>
  <section class="panel" aria-live="polite"><div class="list" id="lead-list">${leadList()}</div></section>`;
}
function leadList(){
  const q=normalize(S.query);
  const list=sortLeads(S.items.filter(FILTERS[S.filter]||FILTERS.All).filter(i=>!q||normalize([i.title,i.funder,i.owner,i.notes,i.nextAction,i.description].join(' ')).includes(q)));
  return list.map(i=>row(i)).join('')||`<p class="empty">${q?'No leads match that search.':S.filter==='Put away'?'Nothing put away.':'No leads here yet.'}</p>`;
}

function detail(i){
  const w=whenText(i),c=checkedText(i),fit=fitExplanation(i),away=PUT_AWAY.includes(i.status);
  const list=(arr,none)=>arr?.length?`<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p class="empty" style="padding:.3rem 0">${none}</p>`;
  const url=safeSource(i.officialUrl);
  const hist=(i.history||[]).slice().reverse().map(h=>`<div>${esc(fmtDate(h.at,{year:true}))} · ${esc(h.action||(h.type==='source-refresh'?'Changed: '+(h.changed||[]).map(k=>FIELD_LABEL[k]||k).join(', '):h.type==='source-check-note'?'Checked the page':h.type))}${h.note?`: ${esc(h.note)}`:''}</div>`).join('');
  return `<div><button class="btn quiet" data-act="back">← Leads</button></div>
  ${head(esc(i.title),`${esc(i.funder||'Funder not noted')}`,`<div class="row">${i.recordType==='sample'?'<span class="tag practice">Practice</span>':''}${i.sentAt?`<span class="tag sent">Sent ${esc(fmtDate(i.sentAt))}</span>`:''}</div>`)}
  ${i.changeFlags?.length?`<div class="changed" role="status"><span><strong>Changed since you last looked:</strong> ${esc(i.changeFlags.map(k=>FIELD_LABEL[k]||k).join(', '))}</span><button class="btn" data-act="ack">OK, noted</button></div>`:''}
  <section class="facts" aria-label="Key facts">
    <div class="fact"><span>Deadline</span><strong class="${w.soon?'when soon':''}">${esc(w.main)}</strong><small>${esc(w.sub)}${i.deadlineTimezone&&dateState(i)!=='ROLLING'&&!/^(unknown|not applicable|not stated)/i.test(i.deadlineTimezone)?` · ${esc(i.deadlineTimezone)}`:''}</small></div>
    <div class="fact"><span>Amount</span><strong>${esc(money(i)||'Not known')}</strong><small>${i.matchingFunds&&i.matchingFunds!=='Unknown'?'Match: '+esc(i.matchingFunds):''}</small></div>
    <div class="fact"><span>Funder's page</span><strong>${esc(c.main)}</strong><small>${esc(c.sub)}</small></div>
  </section>
  <div class="row">${url?`<a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open funder's page ↗</a>`:''}<button class="btn" data-act="check">I checked the page</button><button class="btn" data-act="edit">Edit details</button><button class="btn" data-act="send-one">Send to Dashboard</button>${away?'<button class="btn" data-act="restore">Bring back</button>':'<button class="btn" data-act="archive">Archive</button>'}</div>
  <section class="panel"><h2>Status</h2><div class="seg" role="group" aria-label="Status">${statuses.filter(s=>!PUT_AWAY.includes(s)||s==='Declined'||s===i.status).map(s=>`<button class="chip" data-act="status" data-arg="${s}" aria-pressed="${i.status===s}">${STATUS_LABEL[s]}</button>`).join('')}</div></section>
  <section class="panel"><h2>Your notes</h2><p class="empty" style="padding:0 0 .6rem">These save by themselves.</p><div class="grid2">
    <label class="field"><span>Owner</span><input class="pen" data-live="owner" maxlength="120" value="${esc(i.owner)}" placeholder="Who is looking after this?"></label>
    <label class="field"><span>Next step</span><input class="pen" data-live="nextAction" maxlength="300" value="${esc(i.nextAction)}" placeholder="One small next step"></label>
    <label class="field full"><span>Notes</span><textarea class="pen" data-live="notes" rows="3" placeholder="Anything worth remembering">${esc(i.notes)}</textarea></label>
  </div></section>
  <section class="panel"><h2>${esc(fit.label)}</h2><div class="reasons">
    <div><h3>Why it might fit</h3>${list(i.fitReasons,'Not noted yet.')}</div>
    <div><h3>Still to find out</h3>${list(i.gaps,'Nothing noted. Eligibility is still checked on the funder\'s page.')}</div>
    <div><h3>Deal-breakers</h3>${list(i.disqualifiers,'None noted.')}</div>
  </div></section>
  <details class="more panel"><summary>More details</summary><dl class="kv">
    ${[['About it',i.description],['Who can apply',i.applicantEligibility],['Area',i.geography],['How to apply',i.applicationRoute],['Matching funds',i.matchingFunds],['Restrictions',i.restrictions],['Fit, in words',i.programFit],['Link',url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`:'']].map(([k,v])=>`<dt>${k}</dt><dd>${k==='Link'?(v||'Not noted'):esc(v||'Not noted')}</dd>`).join('')}

// ------------------------------------------------------------------ toast --
let toastTimer=0;
function toast(msg,action){
  const t=$('#toast');if(!t)return;
  clearTimeout(toastTimer);
  t.innerHTML=`<span>${esc(msg)}</span>${action?`<button class="btn" id="toast-act">${esc(action.label)}</button>`:''}`;
  t.classList.add('show');
  if(action)$('#toast-act').onclick=()=>{t.classList.remove('show');action.fn()};
  toastTimer=setTimeout(()=>t.classList.remove('show'),action?7000:3500);
}

// ------------------------------------------------------------------ files --
async function saveFile(name,text){
  await Promise.race([caps.ready,new Promise(r=>setTimeout(r,3000))]);
  if(caps.downloads){
    try{await caps.downloads.save({filename:name,data:text});return true}
    catch(e){if(e&&e.code==='declined'){toast('Not saved.');return false}if(e&&e.code==='rate_limited'){toast('A save box is already open.');return false}}
  }
  try{
    const blob=new Blob([text],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true;
  }catch{showCopy(name,text);return false}
}
function sendFile(copy){
  const picked=S.items.filter(i=>(S.picks||[]).includes(i.id));
  let data;try{data=buildExport(picked)}catch(e){toast(e.message);return}
  const name=exportFileName(picked),text=JSON.stringify(data,null,2);
  const done=()=>{const at=new Date().toISOString();for(const i of picked)i.sentAt=at;persist();log('Sent to the Grant Dashboard',null,`${picked.length} leads`);S.lastSent={name,count:picked.length};S.picks=[];render()};
  if(copy){showCopy(name,text,done);return}
  saveFile(name,text).then(ok=>{if(ok){done();toast(`Saved. Now import it in the Dashboard.`)}});
}
function importText(text){
  let r;try{r=readImport(text,S.items,newId)}catch(e){toast(e.message);return}
  if(r.added.length){S.items=[...r.added,...S.items];persist();log('Opened a file',null,`${r.added.length} added`)}
  const parts=[`${r.added.length} lead${r.added.length===1?'':'s'} added`];
  if(r.skipped.length)parts.push(`${r.skipped.length} already here`);
  if(r.problems.length)parts.push(`${r.problems.length} could not be read`);
  const added=r.added.map(i=>i.id);
  render();
  toast(parts.join(', ')+'.',r.added.length?{label:'Undo',fn:()=>{S.items=S.items.filter(i=>!added.includes(i.id));persist();render();toast('Removed what was added.')}}:null);
  if(r.problems.length)console.warn('Grant Radar import:',r.problems);
}

function deadlineFields(v,prefix=''){

function wireDeadline(form,prefix=''){
  const date=form.querySelector(`[name="${prefix}deadline"]`);

}
const lines=v=>String(v||'').split('\n').map(x=>x.trim()).filter(Boolean);
const num=v=>v===''||v==null?null:Number(v);

function formToLead(form,v,lenient=false){
  const f=new FormData(form),g=k=>String(f.get(k)??'');
  const kind=g('deadlineKind')||'unknown';
  return {...v,title:g('title').trim(),funder:g('funder').trim(),officialUrl:g('officialUrl').trim(),
    deadlineKind:kind,deadline:kind==='confirmed'?g('deadline'):(lenient?g('deadline'):''),
    fundingMin:num(g('fundingMin')),fundingMax:num(g('fundingMax')),nextAction:g('nextAction').trim(),
    fitReasons:lines(g('fitReasons')),gaps:lines(g('gaps')),disqualifiers:lines(g('disqualifiers')),
    applicantEligibility:g('applicantEligibility'),geography:g('geography'),applicationRoute:g('applicationRoute'),
    matchingFunds:g('matchingFunds'),restrictions:g('restrictions'),deadlineTimezone:g('deadlineTimezone').trim(),
    description:g('description'),status:g('status')||v.status,owner:g('owner').trim(),externalId:g('externalId').trim(),
    recordType:f.get('practice')?'sample':'public'};
}
function openLeadForm(item){
  const editing=!!item;
  const v=editing?clone(item):(S.draft?clone(S.draft):blankLead());
  const t=(name,label,val,attrs='')=>`<label class="field"><span>${label}</span><input class="pen" name="${name}" value="${esc(val??'')}" ${attrs}></label>`;
  const ta=(name,label,val,hint='')=>`<label class="field full"><span>${label}</span><textarea class="pen" name="${name}" rows="2">${esc(val??'')}</textarea>${hint?`<small>${hint}</small>`:''}</label>`;
  openDialog(`<div class="dialog-head"><h2 id="dlg-title">${editing?'Edit lead':'Add a lead'}</h2><button class="btn quiet" data-dismiss aria-label="Close">Close</button></div>
  <form id="lead-form" data-mode="${editing?'edit':'add'}" novalidate><div class="grid2">
    <label class="field full"><span>Name of the grant</span><input class="pen" name="title" maxlength="180" required value="${esc(v.title)}" placeholder="e.g. Community Wellness Fund 2027"><small>The only thing you need. Everything else can wait.</small></label>
    ${t('funder','Funder',v.funder,'maxlength="180" placeholder="Who gives the money"')}
    ${t('officialUrl','Link to the funder\'s page',v.officialUrl,'type="url" inputmode="url" maxlength="2000" placeholder="https://"')}
    ${deadlineFields(v)}
    ${t('fundingMax','Up to ($)',v.fundingMax,'type="number" min="0" step="500" inputmode="numeric"')}
    ${t('nextAction','Next step',v.nextAction,'maxlength="300" placeholder="One small next step"')}
  </div>
  <details class="more" ${editing?'':''}><summary>More details</summary><div class="grid2">
    ${ta('fitReasons','Why it might fit',(v.fitReasons||[]).join('\n'),'One per line.')}
    ${ta('gaps','Still to find out',(v.gaps||[]).join('\n'),'One per line.')}
    ${ta('disqualifiers','Deal-breakers',(v.disqualifiers||[]).join('\n'),'One per line.')}
    ${ta('applicantEligibility','Who can apply',v.applicantEligibility)}
    ${t('geography','Area',v.geography)}${t('applicationRoute','How to apply',v.applicationRoute)}
    ${t('matchingFunds','Matching funds',v.matchingFunds)}${t('deadlineTimezone','Deadline time zone',v.deadlineTimezone,'placeholder="e.g. 5 pm Central"')}
    ${t('fundingMin','At least ($)',v.fundingMin,'type="number" min="0" step="500" inputmode="numeric"')}
    ${t('owner','Owner',v.owner,'maxlength="120"')}
    ${ta('restrictions','Restrictions',v.restrictions)}${ta('description','About it',v.description)}
    <label class="field"><span>Status</span><select class="pen" name="status">${statuses.map(s=>`<option value="${s}" ${v.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}</select></label>
    ${t('externalId','Lead ID',v.externalId,'maxlength="100"')}
    <label class="field full" style="grid-template-columns:auto 1fr;align-items:center;gap:.6rem"><input type="checkbox" name="practice" ${v.recordType==='sample'?'checked':''} style="width:1.2em;height:1.2em;accent-color:var(--accent)"><span style="font-size:.95em;color:var(--ink);font-weight:400">This is a practice lead (made up)</span></label>
  </div></details>
  <p class="form-error" id="form-error" role="alert"></p>
  <div class="dialog-foot">${!editing&&S.draft?'<button type="button" class="btn quiet" id="clear-draft">Clear form</button>':''}<button type="button" class="btn" data-dismiss>Close</button><button class="btn primary">Save lead</button></div></form>`,
  dlg=>{
    const form=dlg.querySelector('#lead-form');wireDeadline(form);
    dlg.querySelector('#clear-draft')?.addEventListener('click',()=>{S.draft=null;$('#dialog-root').innerHTML='';openLeadForm(null)});
    form.addEventListener('submit',e=>{
      e.preventDefault();
      const c=formToLead(form,v);
      try{validateOpportunity(c)}catch(err){$('#form-error').textContent=err.message;return}
      const dupe=findDuplicate(S.items,c,v.id);
      if(dupe){$('#form-error').innerHTML=`This looks like “${esc(dupe.title)}”, which is already here. <button type="button" class="btn quiet" id="open-dupe">Open it</button>`;$('#open-dupe').onclick=()=>{S.draft=null;$('#dialog-root').innerHTML='';ACT.open(dupe.id)};return}
      c.id=v.id||newId();c.history=[...(v.history||[]),{at:new Date().toISOString(),type:'staff-edit',action:editing?'Edited':'Added'}];
      if(editing)S.items=S.items.map(x=>x.id===v.id?c:x);else{S.items.unshift(c);S.draft=null}
      persist();log(editing?'Edited a lead':'Added a lead',c);
      $('#dialog-root').innerHTML='';S.tab='Leads';S.selected=c.id;render();$('#page-title')?.focus();
      toast(editing?'Saved.':'Lead added.');
    });
    setTimeout(()=>form.querySelector('[name=title]').focus(),60);
  });
}
function openCheckForm(item){
  if(!item)return;
  const today=localToday();
  openDialog(`<div class="dialog-head"><h2 id="dlg-title">I checked the funder's page</h2><button class="btn quiet" data-dismiss aria-label="Close">Close</button></div>
  <p class="empty" style="padding:0 0 .8rem">Note what the page says now. Your notes, owner and status stay as they are.</p>
  <form id="check-form" novalidate><div class="grid2">
    <label class="field"><span>Date you looked</span><input class="pen" type="date" name="checked" max="${today}" value="${today}"></label>
    <fieldset class="field" style="border:0;padding:0;margin:0"><span>Is it open?</span><div class="seg">${[['open','Open'],['closed','Closed'],['unknown','Not sure']].map(([val,l])=>`<label class="chip" style="display:inline-flex;align-items:center;gap:.4rem"><input type="radio" name="sourceAvailability" value="${val}" ${(item.sourceAvailability||'unknown')===val?'checked':''} style="accent-color:var(--accent)">${l}</label>`).join('')}</div></fieldset>
    ${deadlineFields(item)}
    <label class="field"><span>At least ($)</span><input class="pen" type="number" min="0" name="fundingMin" value="${item.fundingMin??''}"></label>
    <label class="field"><span>Up to ($)</span><input class="pen" type="number" min="0" name="fundingMax" value="${item.fundingMax??''}"></label>
    <label class="field"><span>How to apply</span><input class="pen" name="applicationRoute" value="${esc(item.applicationRoute||'')}"></label>
    <label class="field"><span>Deadline time zone</span><input class="pen" name="deadlineTimezone" value="${esc(item.deadlineTimezone||'')}"></label>
    <label class="field full"><span>Restrictions</span><textarea class="pen" name="restrictions" rows="2">${esc(item.restrictions||'')}</textarea></label>
    <label class="field full"><span>What did you notice? (optional)</span><textarea class="pen" name="checkNote" rows="2" placeholder="Anything that changed, or is still unclear"></textarea></label>
  </div><p class="form-error" id="check-error" role="alert"></p>
  <div class="dialog-foot"><button type="button" class="btn" data-dismiss>Close</button><button class="btn primary">Save check</button></div></form>`,
  dlg=>{
    const form=dlg.querySelector('#check-form');wireDeadline(form);
    form.addEventListener('submit',e=>{
      e.preventDefault();
      const f=new FormData(form),g=k=>String(f.get(k)??'');
      const checked=g('checked')&&g('checked')<=today?g('checked'):today;
      const kind=g('deadlineKind')||'unknown';
      const copy=clone(item);
      const incoming={...copy,sourceAvailability:g('sourceAvailability'),deadlineTimezone:g('deadlineTimezone').trim(),applicationRoute:g('applicationRoute'),restrictions:g('restrictions'),
        checkedAt:new Date(checked+'T12:00:00Z').toISOString(),sourceState:'CURRENT',deadlineKind:kind,deadline:kind==='confirmed'?g('deadline'):'',
        fundingMin:num(g('fundingMin')),fundingMax:num(g('fundingMax'))};
      try{validateOpportunity(incoming)}catch(err){$('#check-error').textContent=err.message;return}
      const merged=mergeRefresh(copy,incoming);
      // A fresh check is not itself a change worth flagging.
      merged.changeFlags=merged.changeFlags.filter(k=>k!=='sourceState'||copy.changeFlags?.includes('sourceState'));
      if(g('sourceAvailability')==='closed'&&!PUT_AWAY.includes(merged.status))merged.history.push({at:new Date().toISOString(),type:'staff-decision',action:'Page says closed'});
      merged.history.push({at:new Date().toISOString(),type:'source-check-note',note:g('checkNote').trim()});
      S.items=S.items.map(x=>x.id===copy.id?merged:x);persist();log('Checked the funder\'s page',merged,g('checkNote'));
      $('#dialog-root').innerHTML='';render();$('#page-title')?.focus();
      const real=merged.changeFlags.filter(k=>!(copy.changeFlags||[]).includes(k));
      toast(real.length?`Saved. Changed: ${real.map(k=>FIELD_LABEL[k]||k).join(', ')}.`:'Saved. Nothing changed.');
    });
    setTimeout(()=>form.querySelector('[name=checked]').focus(),60);
  });
}
function showCopy(name,text,onDone){
  openDialog(`<div class="dialog-head"><h2 id="dlg-title">Copy the file</h2><button class="btn quiet" data-dismiss aria-label="Close">Close</button></div>
  <p>Copy this text, paste it into a plain text file, and save it as <strong>${esc(name)}</strong>.</p>
  <textarea id="copy-text" class="pen" rows="8" readonly style="font-family:ui-monospace,monospace;font-size:.8em">${esc(text)}</textarea>
  <div class="dialog-foot"><button class="btn primary" id="copy-btn">Copy</button></div>`,
  dlg=>{dlg.querySelector('#copy-btn').onclick=async()=>{const ta=dlg.querySelector('#copy-text');try{await navigator.clipboard.writeText(text);toast('Copied.')}catch{ta.focus();ta.select();toast('Selected. Press Ctrl+C (or ⌘+C) to copy.')}onDone&&onDone()}});
}

// ------------------------------------------------------------------- tour --
function startTour(){S.tour=0;if(S.tab!=='Home'){S.tab='Home';S.selected=null;render()}showTour()}
function endTour(done=true){
  S.tour=-1;document.querySelectorAll('.tour-ring,.tour-card,.tour-dim').forEach(n=>n.remove());
  S.onboarded=true;save(STORAGE.onboarding,{result:done?'completed':'skipped',at:new Date().toISOString()});
  if(done)toast('Want to try it on the practice lead?',{label:'Open it',fn:()=>ACT.practice()});
  $('#page-title')?.focus();
}
function showTour(){
  document.querySelectorAll('.tour-ring,.tour-card,.tour-dim').forEach(n=>n.remove());
  const step=TOUR[S.tour];if(!step)return endTour(true);
  const target=step.target?[...document.querySelectorAll(`[data-tour="${CSS.escape(step.target)}"]`)].find(n=>n.offsetParent!==null||n.getClientRects().length):null;
  const card=document.createElement('div');card.className='tour-card';card.setAttribute('role','dialog');card.setAttribute('aria-modal','true');card.setAttribute('aria-labelledby','tour-title');
  card.innerHTML=`<span class="dots" role="img" aria-label="Step ${S.tour+1} of ${TOUR.length}">${TOUR.map((_,k)=>`<i class="${k<=S.tour?'on':''}"></i>`).join('')}</span><h2 id="tour-title" tabindex="-1">${esc(step.title)}</h2><p>${esc(step.body)}</p>
    <div class="row" style="justify-content:space-between;margin-top:.8rem"><button class="btn quiet" id="tour-skip">Skip tour</button><div class="row">${S.tour>0?'<button class="btn" id="tour-back">Back</button>':''}<button class="btn primary" id="tour-next">${S.tour===TOUR.length-1?'Done':'Next'}</button></div></div>`;
  if(target){
    const r=target.getBoundingClientRect(),pad=6;
    const ring=document.createElement('div');ring.className='tour-ring';
    Object.assign(ring.style,{left:`${r.left-pad}px`,top:`${r.top-pad}px`,width:`${r.width+pad*2}px`,height:`${r.height+pad*2}px`});
    document.body.appendChild(ring);document.body.appendChild(card);
    const cw=card.offsetWidth,ch=card.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;
    let left=r.right+16,top=r.top;
    if(left+cw>vw-16){left=Math.min(Math.max(16,r.left),vw-cw-16);top=r.bottom+16;if(top+ch>vh-16)top=r.top-ch-16}
    card.style.left=`${Math.max(16,left)}px`;card.style.top=`${Math.max(16,Math.min(top,vh-ch-16))}px`;
  }else{
    const dim=document.createElement('div');dim.className='tour-dim';document.body.appendChild(dim);document.body.appendChild(card);
    card.style.left=`${Math.max(16,(window.innerWidth-card.offsetWidth)/2)}px`;card.style.top=`${Math.max(16,(window.innerHeight-card.offsetHeight)/2)}px`;
  }
  card.querySelector('#tour-skip').onclick=()=>endTour(false);
  card.querySelector('#tour-next').onclick=()=>{S.tour++;S.tour>=TOUR.length?endTour(true):showTour()};
  card.querySelector('#tour-back')?.addEventListener('click',()=>{S.tour--;showTour()});
  card.querySelector('#tour-title').focus();
}
window.addEventListener('resize',()=>{if(S.tour>=0)showTour()});

// --------------------------------------------------------------- keyboard --
document.addEventListener('keydown',e=>{
  const layer=document.querySelector('.tour-card')||document.querySelector('#dialog-root .dialog');
  if(!layer)return;
  if(e.key==='Escape'){e.preventDefault();if(layer.classList.contains('tour-card'))endTour(false);else closeDialog();return}
  if(e.key==='Tab'){
    const nodes=[...layer.querySelectorAll('button,input,select,textarea,a[href],summary')].filter(n=>!n.disabled&&!n.hidden&&n.getClientRects().length);
    if(!nodes.length)return;
    const first=nodes[0],last=nodes[nodes.length-1];
    if(e.shiftKey&&(document.activeElement===first||!layer.contains(document.activeElement))){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&(document.activeElement===last||!layer.contains(document.activeElement))){e.preventDefault();first.focus()}
  }
});

// ------------------------------------------------------------------- boot --
applyComfort();
render();
if(!S.onboarded)setTimeout(startTour,250);
connectCloud();

})();</script>
